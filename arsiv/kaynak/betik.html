   ['DKP','dkp','Sanayide soğuk haddelenmiş ince saca verilen yaygın ad. Yüzeyi sıcak saca göre daha düzgündür, kabin ve panel işlerinde kullanılır.','e'],

   ['Bildirim süresi','bildirim süre','Belirsiz süreli sözleşmeyi bitiren tarafın önceden vermesi gereken haber süresi: kıdeme göre 2, 4, 6 ya da 8 hafta.'],
   ['İhbar tazminatı','ihbar tazminat','Bildirim süresine uymayan tarafın, o sürenin ücreti kadar ödediği tazminat. İşveren de işçi de borçlanabilir; gelir vergisine tabidir.'],
   ['Kıdem tazminatı','kıdem tazminat','En az bir yıl çalışan işçiye, kanunda sayılan yollarla ayrılınca her yıl için 30 günlük giydirilmiş brüt ücret üzerinden ödenen tazminat. Yıllık tutar bir tavanı aşamaz.'],
   ['Giydirilmiş ücret','giydirilmiş (?:brüt )?ücret','Çıplak ücrete düzenli ödenen yol, yemek, ikramiye gibi para ve parayla ölçülebilen menfaatlerin eklenmesiyle bulunan ücret. Kıdem ve ihbar bununla hesaplanır.'],
   ['İşe iade','işe iade','İş güvencesindeki işçinin, feshin geçersiz olduğunu ileri sürüp işine dönmeyi istemesi. Önce bir ay içinde arabulucuya başvurmak zorunludur.'],
   ['İşe başlatmama tazminatı','işe başlatmama','Feshi geçersiz bulunan işçiyi bir ay içinde işe başlatmayan işverenin ödediği, dört ila sekiz aylık ücret tutarındaki tazminat.'],
   ['Fazla çalışma','fazla (?:çalışma|mesai)','Haftalık 45 saati aşan çalışma. Her saati yüzde 50 zamlı ödenir, yılda 270 saati geçemez.'],
   ['Yıllık ücretli izin','yıllık (?:ücretli )?izin','En az bir yıl çalışan işçinin kıdemine göre 14, 20 ya da 26 günlük ücretli izni. Vazgeçilemez, ancak sözleşme bitince paraya çevrilir.'],
   ['Asgari ücret','asgari ücret','Bir işçiye ödenebilecek en düşük ücret; her yıl komisyonca belirlenir. 2026 için aylık brüt 33.030, net 28.075,50 lira.'],
   ['Tutanak','tutana[kğ]','Bir olayın tarih, saat, yer ve tanıklarla yorumsuz yazıldığı, olayı görenlerin imzaladığı belge. Disiplinde ve fesihte temel delildir.'],
   ['Yazılı savunma','yazılı savunma','İşçiden hakkındaki iddiaya karşı yazılı açıklama istenmesi. İş güvencesindeki işçi, davranışı ya da verimi yüzünden savunması alınmadan çıkarılamaz.'],

   ['İşe giriş bildirgesi','işe giriş bildirge','İşçinin sigortalı olarak işe başladığının SGK\'ya bildirildiği belge; en geç işe başlamadan bir gün önce verilir.'],

   ['Malzeme planı','malzeme plan','Bir iş için hangi kalınlıkta, hangi kalitede ve ne kadar hammadde gerektiğinin, stoktan mı yoksa siparişle mi karşılanacağının çıkarılması.'],

   ['Fason','fason','İşin bir kısmını ya da tamamını ücret karşılığı başka bir atölyeye yaptırmak; malzeme çoğu zaman iş verenden gelir.'],
   ['ERP','erp','Kurumsal kaynak planlama yazılımı: sipariş, stok, satın alma, üretim, sevkiyat, fatura ve muhasebe bilgisini tek veritabanında tutar.','e'],

   ['İlk parça onayı','ilk parça onay','Yeni bir işte ya da kalıp değişiminde ilk üretilen parçanın ölçülüp onaylanması; onay gelmeden seri üretime geçilmez.'],
   ['ISO 9001','iso 9001','Uluslararası Standardizasyon Örgütü\'nün kalite yönetim sistemi standardı. Ürünü değil işi yönetme biçimini belgeler; son baskısı 2026 tarihlidir.'],
   ['5S','5s','Atölye düzeni yöntemi: ayıkla, düzenle, temizle, standartlaştır, sürdür. Adını Japonca beş kelimenin baş harfinden alır.','e'],
   ['Kaizen','kaizen','Japonca kökenli, küçük ve sürekli iyileştirme anlayışı. Büyük proje yerine her hafta ölçülebilir küçük bir düzeltme.'],

   ['Sat ve geri kirala','sat ve geri kirala','Şirketin sahip olduğu bir malı finansal kiralama kuruluşuna satıp aynı malı ondan kiralaması; eldeki makineyi nakde çevirmenin yolu.'],
   ['Yatırım teşvik belgesi','yatırım teşvik belge','Devletin belirli yatırımlara KDV istisnası, gümrük vergisi muafiyeti, vergi indirimi gibi destekler sağladığı belge. Harcamadan önce alınmalıdır.'],
   ['E-TUYS','e-tuys','Sanayi ve Teknoloji Bakanlığı\'nın teşvik belgesi başvurularının ve işlemlerinin yapıldığı elektronik sistem.'],

   ['Sac fiyatı maddesi','sac fiyatı(?:na bağlı fiyat)? madde','Teklif ya da sözleşmede fiyatın sac listesi ve kurla birlikte güncelleneceğini belirleyen madde. İyisi eşikli, iki yönlüdür ve yalnızca sac payına uygulanır.'],
   ['Müşteri kârlılığı','müşteri (?:bazında )?k[âa]rlılı','Bir müşteriden gelen katkı payından vade, iskonto, revizyon, özel ambalaj gibi o müşteriye özel maliyetler düşüldükten sonra kalan kâr.'],
   ['Paranın zaman değeri','paranın zaman değer','Bugünkü bir liranın yarınki bir liradan değerli olması. Yatırım hesabına finansman maliyetinin eklenmesinin sebebidir.'],
   ['Aşırı ifa güçlüğü','aşırı ifa güçlü','Öngörülemeyen olağanüstü bir değişiklik borcu yerine getirmeyi aşırı zorlaştırırsa sözleşmenin uyarlanmasını sağlayan Borçlar Kanunu kuralı (md. 138).'],
   ['İş kazası','iş kazas','İşyerinde ya da işin yürütülmesi sebebiyle olan ve çalışanı bedenen ya da ruhen zarara uğratan olay. İşveren kolluğa derhal, SGK\'ya kazadan sonraki üç iş günü içinde bildirir.'],

   ['Tehlike sınıfı','tehlike sınıf','İşyerinin az tehlikeli, tehlikeli ya da çok tehlikeli diye sınıflanması. SGK\'daki faaliyet koduna (NACE) göre resmî liste belirler; uzman ve hekim süreleri buna bağlıdır.'],

   ['OSGB','osgb','Ortak sağlık ve güvenlik birimi. Kendi uzmanını ve hekimini istihdam etmeyen işyerlerine bu hizmeti veren yetkili kuruluş.','e'],

   ['Peşin sermaye değeri','peşin sermaye değer','SGK\'nın bağladığı sürekli gelirin bugünkü toplu karşılığı. Kusurlu işverene rücu edilen tutarın büyük kısmını oluşturur.'],
   ['Kur riski','kur risk','Gelir ve giderin farklı para birimlerinde olmasından doğan risk. Sacı dolar bazlı alıp vadeli lira fiyatıyla satan atölye bu riski taşır.'],
   ['Kur şoku','kur şok','Döviz kurunun kısa sürede sert biçimde yükselmesi. Dolar bazlı sac fiyatı aynı gün liraya yansır, sabit liralı teklifler zarara döner.'],
   ['Damping','damping','Malı kendi ülkesindeki fiyatın altında ihraç etmek. Türkiye bazı ülkelerden gelen sıcak haddelenmiş yassı çeliğe (2024) dampinge karşı vergi uygular.'],
   ['Yerine koyma maliyeti','yerine koyma maliyet','Stoktaki malı bugün yeniden almanın maliyeti. Kur ya da sac fiyatı artınca fiyat verirken eski alış maliyetine değil buna bakılır.'],
   ['Tek nokta arızası','tek nokta arıza','Tek bir makinenin ya da parçanın durmasıyla bütün üretimin durması. Atölyede tek lazer varsa lazer budur.'],

   ['Aile şirketi','aile şirket','Sahipliği ve yönetimi büyük ölçüde bir ailenin elinde olan şirket. Aile, mülkiyet ve iş ilişkileri iç içe geçer.'],
   ['Aile anayasası','aile anayasa','Ailenin şirketle ilişkisini (aile üyelerinin işe giriş şartları, ücret, kâr dağıtımı, halefiyet, anlaşmazlık çözümü) yazıya döken metin. İmzalayanları bağlar; şirketi bağlaması için şirket sözleşmesine ya da ortaklar sözleşmesine taşınması gerekir.'],
   ['Aile konseyi','aile konsey','Aile anayasasını uygulayan, şirkette çalışmayan aile üyelerine de söz hakkı veren aile kurulu.'],
   ['Halefiyet','halefiyet','Kurucunun ya da yöneticinin yerine kimin, ne zaman ve nasıl geçeceğinin önceden planlanması.'],
   ['İkinci kuşak','ikinci kuşa[kğ]','Aile şirketinde kurucudan sonra gelen kuşak: çocuklar, yeğenler ya da yakın akrabalar.'],
   ['Üç daire modeli','üç daire','Aile şirketini aile, mülkiyet ve iş olmak üzere üç iç içe daireyle anlatan model. Kişinin hangi dairede durduğu, hangi kuralla değerlendirileceğini belirler.'],
   ['Müdür','müdür(?:ü|ün|e|de|den|ler|leri|lerin|lere|lük|lüğü|lüğe)?','Limited şirkette şirketi yöneten ve dışarıya karşı temsil eden, ticaret siciline tescil edilen kişi. Şirket sözleşmesiyle atanır ya da genel kurulca seçilir.','e'],
   ['Şirket sözleşmesi','şirket sözleşme','Şirketin kuruluşunda yapılan ve ticaret siciline tescil edilen temel sözleşme; esas sözleşme de denir. Yönetim, temsil ve pay kuralları burada yazar.'],
   ['Ortaklar sözleşmesi','ortaklar sözleşme','Ortakların kendi aralarında yaptığı, kamuya açık olmayan sözleşme; pay sahipleri sözleşmesi de denir. Kâr dağıtımı, pay devri, anlaşmazlık çözümü gibi konuları düzenler.'],

   ['Erdemir','erdemir','Ereğli Demir ve Çelik: Zonguldak Karadeniz Ereğli\'deki entegre çelik üreticisi, OYAK grubunda. Açıkladığı dolar bazlı yurt içi yassı çelik fiyatları sac piyasasına yön verir.'],
   ['İsdemir','isdemir','İskenderun Demir ve Çelik: Erdemir grubundaki, İskenderun\'da yassı ve uzun çelik üreten entegre tesis.'],

   ['Dükkânın anahtarını vermek','(?:dükkânın|dükkanın) anahtar','Esnaf ağzı: Kurucunun yetkiyi ve sorumluluğu yeni kuşağa teslim etmesi. "Usta anahtarı kolay vermez" denir.'],
   ['BATNA','batna','İngilizce "best alternative to a negotiated agreement": anlaşma olmazsa elindeki en iyi gerçek seçenek. Fisher ve Ury\'nin Getting to Yes kitabından (1981); pazarlıktaki gücü belirler.'],

   ['ZOPA','zopa','İngilizce "zone of possible agreement", olası anlaşma bölgesi: satıcının tabanı ile alıcının tavanı arasındaki aralık. Bu aralık yoksa rakamda anlaşma olmaz.'],

   ['Pozisyon','pozisyon(?:u|unu|una|lar|ları|larını|da)?','Pazarlıkta masaya konan talep: "Kabin başına 19.000 lira istiyorum." Arkasındaki sebep, yani çıkar, çoğu zaman söylenmez.','e'],
   ['Çıkar','çıkar(?:ı|ını|ına|ları|larını|ların)','Bir pozisyonun arkasındaki asıl sebep ya da ihtiyaç: bütçe hedefi, teslim korkusu, kalite kaygısı. Sorarak bulunur ve fiyattan başka çözümler açar.','e'],
   ['Taban fiyat','taban fiyat','Satıcının maliyet artı asgari kâra göre hesapladığı, altına inmeyeceği fiyat. Sanayide "dip" de denir.'],
   ['Yassı çelik','yassı çelik','Levha ve rulo hâlinde üretilen çelik; sac bunun gündelik adıdır. Türkiye\'de başlıca üreticisi Erdemir ve İsdemir\'dir.'],
   ['Ortasında buluşmak','ortasında buluş','İki rakamın tam ortasında anlaşma önerisi. Adil görünür ama orta, açılış rakamlarına bağlıdır; uç rakamla açan taraf ortayı kendine çeker.'],
   ['Öneri','öneri(?:si|yi|ye|nin|ler|leri|lerin|de|den|siyle)?','Borçlar Kanunu\'nun teklif için kullandığı terim. Kabul edilince sözleşme kurulur; teklifi veren, süre koyduysa o süre boyunca önerisiyle bağlıdır.','e'],
   ['Süreli öneri','süreli öneri','"Bu teklif 10 gün geçerlidir" gibi kabul için süre konmuş teklif. Öneren süre dolana kadar bağlıdır; kabul bu süre içinde ona ulaşmazsa bağlılık biter (TBK 3).'],
   ['Örtülü kabul','örtülü kabul','Açık kabul beklenmeyen durumlarda, uygun sürede reddedilmeyen önerinin kabul edilmiş sayılması (TBK 6). Sessiz kalıp işe başlamak da kabul olarak okunabilir.'],
   ['Teyit mektubu','teyit mektub','Sözlü, telefonla ya da mesajla kurulan sözleşmeyi doğrulayan yazı. Alan tacir sekiz gün içinde itiraz etmezse içeriği kabul etmiş sayılır (TTK 21/3).'],
   ['Çerçeve sözleşme','çerçeve sözleşme','Uzun süreli işlerde fiyat, sac maddesi, teslim, kalite ve fesih gibi ortak şartların bir kez yazıldığı sözleşme. Her teslim için ayrıca kısa çağrı siparişleri verilir.'],
   ['Çağrı siparişi','çağrı sipariş','Çerçeve sözleşmeye dayanarak yalnızca adet ve teslim tarihi bildiren kısa sipariş. Sözleşme genellikle teslimden kaç gün önce gelmesi gerektiğini yazar.'],
   ['Cezai şart','cezai şart','Kanundaki adıyla ceza koşulu: borcu hiç ya da zamanında yerine getirmeyenin önceden belirlenmiş bir tutarı ödemeyi üstlenmesi. Zarar ispatı gerekmez; tacir aşırı cezanın indirilmesini isteyemez (TBK 179–182, TTK 22).'],
   ['Götürü bedel','götürü bedel','İş için baştan toptan belirlenmiş bedel. Yüklenici, iş öngörülenden pahalıya gelse bile bedelin artırılmasını isteyemez (TBK 480); sac maddesi bu yüzden yazılır.'],
   ['Tacir','tacir(?:in|e|i|ler|lerin|lere|ler arası|ler arasında)?','Bir ticari işletmeyi kısmen de olsa kendi adına işleten kişi; ticaret şirketleri de tacirdir. Tacire Ticaret Kanunu\'nda basiretli davranma ve bazı sürelere uyma gibi daha ağır kurallar uygulanır.','e'],
   ['Senetle ispat','senetle ispat','Belli bir tutarı aşan hukuki işlemlerin imzalı belgeyle ispat edilmesi kuralı (HMK 200). Sınır her yıl güncellenir; 2026 için 41 bin liradır.'],
   ['Delil başlangıcı','delil başlangıc','Karşı taraftan çıkmış ve iddiayı muhtemel gösteren, ama tek başına senet sayılmayan belge (HMK 202). E-posta ve WhatsApp yazışmaları çoğu zaman böyle sayılır ve tanık dinlenmesini sağlar.'],
   ['Delil sözleşmesi','delil sözleşme','Tarafların hangi vakıanın hangi delille ispat edileceğini yazılı olarak kararlaştırması (HMK 193). Ör. belirli adreslerden gelen e-postaların yazılı delil sayılması.'],
   ['Güvenli elektronik imza','güvenli elektronik imza','Nitelikli sertifikaya dayanan, yalnız sahibinin kullanabildiği elektronik imza. Bununla oluşturulan veri senet hükmündedir (HMK 205).'],
   ['Kayıtlı elektronik posta','kayıtlı elektronik posta','KEP: gönderim ve teslimin hukuken ispatlanabildiği elektronik posta. Tacirler arasında temerrüt, fesih ve dönme bildirimleri noter, taahhütlü mektup, telgraf ya da güvenli e-imzalı KEP ile yapılır (TTK 18/3).'],
   ['Ticari defter','ticari defter','Tacirin kanunen tutmak zorunda olduğu defterler. Usulüne uygun tutulmuş, açılış ve kapanış onayı yapılmış defter ticari davada sahibi lehine delil olabilir (HMK 222).'],
   ['Teknik şartname','teknik şartname','Çizimde görünmeyen malzeme kalitesi, kaynak standardı, boya, tolerans, ambalaj ve muayene yöntemini yazan belge. Teklif ve teyit aynı şartnameye ve revizyona bağlanır.'],
   ['E-fatura','e-fatura','Kayıtlı kullanıcılar arasında Gelir İdaresi sistemi üzerinden düzenlenip iletilen elektronik fatura. Önceki yıl hasılatı belli sınırı aşanlar için zorunludur.'],
   ['E-irsaliye','e-irsaliye','Sevk irsaliyesinin elektronik hâli; kâğıt irsaliyeyle aynı hukuki değeri taşır. Belli hasılat sınırını aşanlarda ve demir-çelik ürünlerinde zorunludur.'],
   ['Artı KDV','artı kdv','Söylenen fiyata KDV\'nin ayrıca ekleneceğini anlatan esnaf ifadesi. Teklifte "KDV dahil değildir" diye yazılı geçmelidir.'],
   ['Fabrika teslim','fabrika teslim','Malın satıcının kapısında teslim edildiği şart; nakliye ve yolda risk alıcıdadır.'],
   ['Niyet okumak','niyet oku','Karşı tarafın bir konuşmadan asıl ne istediğini ve ne kadar ciddi olduğunu işaretlerden tahmin edip bu tahmini sorularla ve küçük denemelerle sınamak. Zihin okumak değil, doğrulamaktır.'],
   ['Aktif dinleme','aktif dinle','Araya girmeden dinleyip duyduğunu kendi sözleriyle geri söyleme ve konuşanın söylediğiyle birlikte hissettiğini de anlamaya çalışma yöntemi. Carl Rogers ve Richard Farson iş yerine uyarladı (1957).'],
   ['BANT','BANT','Satışta bir talebin ciddiyetini sınayan dört sorunun İngilizce baş harfleri: bütçe (budget), karar yetkisi (authority), ihtiyaç (need), zaman (timeline).','ec'],
   ['Fiyat soran','fiyat soran','Satın almaya karar vermeden, kıyas yapmak ya da mevcut tedarikçisini sıkıştırmak için teklif isteyen kişi. Çizimi eksik, karar tarihi belirsizdir, yalnızca rakam ister.'],
   ['Yapay aciliyet','yapay aciliyet','Somut bir sebebe bağlı olmayan, karşı tarafı hızlı ve az pazarlıkla karar vermeye itmek için yaratılan acele havası: "Bugün karar vermezseniz iş gider."'],
   ['Açık soru','açık soru','Cevabı "evet" ya da "hayır" olmayan, anlatmayı gerektiren soru: "Bu parçalar şantiyede neyi bekletiyor?" Niyeti öğrenmek için önce açık soru sorulur.'],
   ['Kapalı soru','kapalı soru','"Evet" ya da "hayır" diye cevaplanan soru. Açık soruyla öğrenilen bilgiyi teyit etmek için kullanılır.'],
   ['Blöf','blöf','Pazarlıkta gerçekte olmayan bir sınırı ya da alternatifi varmış gibi göstermek: "son fiyat", "başka yerde var". Küçük bir maliyetle "peki" diyerek sınanır.'],
   ['Satın almacı','satın almacı','Bir şirkette tedarikçilerden teklif toplayan, pazarlığı yürüten ve siparişi açan kişi. Çoğu zaman bir maliyet hedefiyle ve teklif toplama kuralıyla çalışır, kararı tek başına vermeyebilir.'],
   ['Karar verici','karar verici','Bir satın almada son sözü fiilen söyleyen kişi. Pazarlık yapılan kişi her zaman karar verici değildir; kim olduğunu erkenden öğrenmek gerekir.'],
   ['Ekspres farkı','ekspres fark','Normal termin yerine acil teslim için fazla mesai ve plan değişikliğinin karşılığı olarak fiyata eklenen tutar.'],
   ['Teklif dönüş oranı','teklif dönüş oran','Verilen tekliflerin yüzde kaçının siparişe döndüğü. Teklif emeğinin nereye gittiğini ve fiyat soranlara ne kadar zaman harcandığını gösterir.'],
   ['Stok eritmek','stok erit','Depodaki fazla malı, çoğu zaman iskonto ya da "zam geliyor" gibi bir satış gerekçesiyle elden çıkarmak.'],
   ['Tampon stok','tampon sto[kğ]','Teyitli siparişlerin ötesinde, gecikme ve beklenmedik ihtiyaçlara karşı tutulan küçük güvenlik stoğu. Fiyat tahminine dayalı büyük stoktan farklıdır.'],
   ['İleride çok iş var','ileride çok iş','Bugünkü işte indirim ya da uzun vade isteyip karşılığında belirsiz bir gelecek vaat eden esnaf sözü. Vaat yazıya, örneğin yıllık adet taahhüdüne bağlanmadıkça fiyata yansıtılmaz.'],
   ['Fiyat atmak','fiyat at(?:ın|ar|tı|mak|ıver)','Karar aşamasında olmayan birinin kıyas için kaba bir rakam istemesi: "Bir fiyat atın, bakalım." Fiyat aralığı verilir, ayrıntılı maliyet dökümü verilmez.'],
   ['Fiyat önemli değil','fiyat önemli değil','Acil işte sık duyulan esnaf sözü. Teslim gerçekten acil olabilir; ama çoğu zaman "fiyatı ya da ödemeyi sonra konuşuruz" anlamı taşır. Gücü güvenceye, örneğin peşin kısma harcamak gerekir.'],
   ['Ültimatom','ültimatom','Pazarlığı bitirme iddiası taşıyan "son fiyatımız bu" türü kesin teklif. Arkasında durulmazsa söyleyenin sonraki bütün "son"ları ciddiyetini yitirir.'],
   ['İyi polis kötü polis','iyi polis','Aynı taraftan birinin sert, ötekinin anlayışlı davranarak karşı tarafı "iyi" olana taviz vermeye ittiği pazarlık taktiği. İkisini tek taraf saymak etkisini kırar.'],
   ['Dilimleme','dilimleme','Büyük bir tavizi küçük parçalara bölüp tek tek istemek; "salam taktiği" de denir. Her dilimi toplama katıp paket hâlinde konuşmak korur.'],
   ['Son dakika talebi','son dakika talep','Anlaşmaya varıldıktan, el sıkışıldıktan sonra küçük görünen ek bir şey istemek: "Boyasını da aynı fiyata yaparsınız artık." Bedavaya verilmez, fiyatlanır.'],
   ['Taviz','taviz','Pazarlıkta karşı tarafa bırakılan fiyat ya da şart. Karşılıksız verilmez; "Eğer siz şunu yaparsanız, biz de şunu yaparız" kalıbıyla takas edilir.'],
   ['Yetki sınırı','yetki sınır','Pazarlık edenin kendi başına karar verebileceği aralık: "Bu benim yetkimi aşıyor, patrona sorayım." Hem koruma hem zaman kazanma aracıdır.'],
   ['Aciliyet taktiği','aciliyet','"Akşama kadar söylerseniz sizin" gibi süre baskısıyla karşı tarafı hesap yapmadan karar vermeye itmek. Teyit ve mola ile karşılanır.'],
   ['Aldatma','aldatma','Karşı tarafı bilerek yanlış olgularla sözleşme yapmaya yöneltmek. Aldatılan, yanılması esaslı olmasa bile sözleşmeyle bağlı değildir (TBK 36); öğrenmeden itibaren bir yıl içinde bildirmesi gerekir (TBK 39).'],
   ['Yanılma','yanılma','Sözleşme kurulurken bir konuda yanlış bilgiye ya da kanaate sahip olmak. Esaslıysa yanılan taraf sözleşmeyle bağlı olmayabilir (TBK 30–35).'],
   ['Korkutma','korkutma','Ağır ve yakın bir zarar tehdidiyle sözleşme yaptırmak; korkutulan sözleşmeyle bağlı değildir (TBK 37–38). Bir hakkı kullanacağını söylemek kural olarak korkutma sayılmaz.'],
   ['Aşırı yararlanma','aşırı yararlan','Birinin zor durumundan, düşüncesizliğinden ya da deneyimsizliğinden yararlanılarak açıkça oransız sözleşme yapılması; gabin de denir (TBK 28).'],
   ['Haksız rekabet','haksız rekabet','Rakipler ya da satıcı ile müşteri arasındaki ilişkiyi etkileyen aldatıcı veya dürüstlük kuralına aykırı davranış (TTK 54–55). Tespit, men, düzeltme ve tazminat davası açılabilir; bazı hâlleri suçtur (TTK 62).'],
   ['Kötüleme','kötüleme','Rakibi ya da onun mallarını, fiyatlarını yanlış, yanıltıcı veya gereksiz yere incitici sözlerle küçültmek. Haksız rekabet hâllerindendir (TTK 55).'],
   ['Vergi kaçakçılığı','vergi kaçakçılı','Vergi Usul Kanunu 359. maddede sayılan, hapis cezası öngören fiiller: defter dışı kayıt, sahte ya da yanıltıcı belge gibi. Vergi ziyaı cezası bu fiillerde üç kat uygulanır.'],
   ['KDV indirimi','kdv indirim','Alışlarda ödenen KDV\'nin satışlarda tahsil edilen KDV\'den düşülmesi. Verginin faturada gösterilmesi ve faturanın kanuni deftere kaydedilmesi şarttır; faturasız alımda indirim yapılamaz.'],
   ['Özel belgede sahtecilik','özel belgede sahtecilik','Özel bir belgeyi sahte düzenleyip ya da değiştirip kullanmak; Türk Ceza Kanunu 207. maddede hapis cezası öngörülür. Olmayan bir rakip teklifini kâğıda döküp göstermek bu riski doğurur.'],
   ['Eski fiyattan son parti','eski fiyattan','Sac tedarikçisinin yeni Erdemir listesi gelince elindeki eski maliyetli stoğu kısa süre eski fiyattan satacağını söylemesi. Gerçek bir piyasa olayı da olabilir, aciliyet taktiği de; teyit edilir.'],
   ['Küsuratı atmak','küsurat','Rakamı "yuvarlayalım" diyerek aşağı çekmek; küçük görünen bir dilimleme. Büyük tonajda her kuruş binlerce liraya dönüşür.'],
   ['Oyun kuramı','oyun kuram','Birbirinin kararından etkilenen tarafların nasıl karar verdiğini inceleyen bilim dalı. Buradaki "oyun", eğlence değil, böyle bir karşılıklı durum demektir.'],
   ['Tekrarlanan oyun','tekrarlanan oyun','Aynı tarafların aynı türden kararı tekrar tekrar verdiği durum. Sanayide müşteri ve tedarikçi ilişkisi böyledir; bugünkü davranış yarınki pazarlığı etkiler.'],
   ['Mahkûm ikilemi','mahk[ûu]m ikilem','İki tarafın da işbirliği yapsa kazanacağı ama tek başına kazık atmanın cazip olduğu oyun. İkisi de kazık atarsa ikisi de kaybeder.'],
   ['Kısasa kısas','kısasa kısas','İlk adımda işbirliği yapıp sonra karşı tarafın bir önceki hamlesini tekrarlayan strateji. Axelrod\'un bilgisayar turnuvalarını (1980) kazandı.'],
   ['Geleceğin gölgesi','geleceğin gölge','Axelrod\'un ifadesi: yarın yine karşılaşacağını bilmek, bugün kazık atmanın bedelini büyütür ve işbirliğini ayakta tutar.'],
   ['İtibar','itibar(?:ı|ını|ına|ın|la|lı|sız)?','Başkalarının senin geçmiş davranışına bakarak gelecekte ne yapacağına dair yaptığı tahmin. Ticarette teslim sözü, kalite ve ödemeden yapılır.','e'],
   ['Ahilik','ahili[kğ]','13. yüzyılda Ahi Evran öncülüğünde Kırşehir merkezli örgütlenen esnaf ve zanaatkâr teşkilatı. Çıraklık, kalfalık, ustalık düzeni ve dürüstlük ilkesiyle bilinir.'],
   ['Fütüvvetname','fütüvvetname','Ahilik ve fütüvvet geleneğinin ahlak ve meslek kurallarının yazıldığı kitaplar.'],
   ['Pabucu dama atılmak','pabucu dama','Gözden düşmek, itibarını kaybetmek. Yaygın anlatıya göre kusurlu ayakkabının dükkân damına atılmasından gelir; bu köken tarihçilerce kesinleşmiş değildir.'],
   ['Fırsat zammı','fırsat zamm','Maliyet artışını bahane edip fiyatı artışın gerektirdiğinden fazla yükseltmek. Müşteri hesapladığında güveni bitirir.'],
   ['Gizli zam','gizli zam','Fiyatı aynı bırakıp malzemeyi, kaliteyi ya da miktarı sessizce düşürmek. Müşterinin onaylamadığı malı teslim etmek demektir; ayıplı mal sorumluluğu doğurur.'],
   ['Ayıplı mal','ayıplı mal','Sözleşmede kararlaştırılan ya da olması gereken niteliği taşımayan mal. Satıcının sorumluluğunu doğurur.'],
   ['Yürürlük tarihi','yürürlük tarih','Yeni fiyatın ya da kuralın geçerli olmaya başladığı gün. Zam açıklarken hangi siparişin eski, hangisinin yeni fiyattan olduğunu belirler.'],
   ['Telafi','telafi','Bir hatanın müşteriye verdiği zararı gidermek: geri alma, yenisini yapma, masrafı üstlenme. Cömert ve hızlı telafi ilişkiyi korur.'],
   ['Kök neden','kök neden','Bir hatanın görünen sebebinin altındaki asıl sebep. Giderilmezse hata tekrar eder.'],
   ['Hatır','hatır(?:ı|ımıza|ınız|ınıza|ına|a)?','Uzun ilişkiden ya da geçmiş iyilikten doğan, hesap dışı ayrıcalık isteme hakkı. Sanayide gerçektir ama ölçülü harcanır.','e'],
   ['Söz senettir','söz senet','Yazılı teyide gerek olmadığını, sözün yeteceğini anlatan eski esnaf deyişi. Sözü küçümsemeden konuşulanları yine de yazıyla teyit etmek gerekir.'],
   ['Evet, hayır, evet','evet, hayır, evet','William Ury\'nin ilişkiyi bozmadan reddetme yöntemi: önce neyi koruduğunu söyle, sonra açıkça hayır de, sonra bir yol öner.'],
   ['Yüksek bağlamlı iletişim','yüksek bağlamlı','Anlamın büyük kısmının kelimelerin dışında, yani kimin söylediğinde, ses tonunda ve geçmiş ilişkide taşındığı iletişim. Edward T. Hall\'un Beyond Culture kitabından (1976).'],
   ['Düşük bağlamlı iletişim','düşük bağlamlı','Anlamın kelimelerin içinde olduğu, ne söylendiyse onun kastedildiği iletişim. Sözleşmeler ve yazılı teyitler bu türdendir.'],
   ['Yüz korumak','yüz(?:ünü|ü|leri|lerini)? koru','Karşı tarafı ya da kendini mahcup etmemek için doğrudan söylememek. Esnaf dilinde "hayır" yerine "bakarız" denmesinin başlıca sebebi.'],
   ['Kazık atmak','kazı[kğ]','Halk ağzında aldatmak, bir şeyi çok pahalıya satmak. "Bu fiyat kazık" diyen alıcı çoğu zaman tepkini ölçer; cevap kalem kalem hesaptır.'],
   ['Dostlar alışverişte görsün','dostlar alışverişte görsün','Gösteriş olsun, iş görüyor densin diye bir şey yapmak. Satın almada, iş başka yere verilmişken karşılaştırma için teklif istenmesi.'],
   ['Dostluk başka, alışveriş başka','dostluk başka','Atasözü: dostluk, alışverişte tarafların kendi çıkarını gözetmesine engel değildir. Dostça konuşulur ama hesap ayrı tutulur.'],
   ['Kaçakçılık suçu','kaçakçılık suç','Vergi Usul Kanunu 359. maddedeki suçlar: hasılatı defter dışı bırakmak, kayıtları tahrif etmek, sahte ya da yanıltıcı belge düzenlemek veya kullanmak. Hapis cezası gerektirir.'],
   ['Yanıltıcı belge','yanıltıcı belge','Gerçek bir işleme dayanan ama tutarı ya da içeriği gerçeği yansıtmayan belge (muhteviyatı itibarıyla yanıltıcı belge). Kullanımı kaçakçılık suçudur, KDV indirimi reddedilir.'],
   ['Menşe','menşe(?:i|si|ye)?','Bir malın üretildiği ülke. İthal sacda menşe, kalite ve dampinge karşı vergi açısından önemlidir.','e'],
   ['Allah kerim','allah kerim','Kelime anlamıyla "Allah cömerttir". Ödeme konuşmasında çoğu zaman "şu an param yok, ne zaman olacağını da bilmiyorum" demektir; tarih içermez.'],
   ['Ödeme günü','ödeme gün','Kurumsal firmaların ayda bir ya da iki kez toplu ödeme yaptığı sabit gün. Vadesi gelen fatura bile ödeme gününe kadar bekler.'],
   ['Kapanış günü','kapanış gün','Müşterinin o ayın ödeme döngüsüne fatura kabul ettiği son gün. Kapanışı kaçıran fatura bir sonraki döngüye kalır.'],
   ['Kısmi ödeme','kısmi ödeme','Borcun bir kısmının ödenmesi. Kabul edilir, ama kalanın tarihi yazılı teyit edilir ve hangi faturaya mahsup edildiği belirtilir.'],
   ['Mahsup','mahsup','Bir ödemenin ya da alacağın belli bir borçtan düşülmesi. Gelen paranın hangi faturaya mahsup edildiği açıklamada belli olmalıdır.'],
   ['Eli kulağında','eli kulağında','Deyim: olmak üzere, çok yakında. Sanayide çoğu zaman "henüz bitmedi, ne zaman biteceği de kesin değil" anlamına gelir; aşama ve fotoğraf sorulur.'],
   ['Parçalı göndermek','parçalı gönder','Siparişin hazır olan kısmını önce sevk etmek. Kabul edilecekse kalanın tarihi ve kısmi faturanın vadesi yazılır.'],
   ['Tolerans','tolerans','Çizimde bir ölçünün izin verilen sapma aralığı, örneğin artı eksi yarım milim. Yazılı değilse kalite tartışması sözde kalır; gereğinden sıkısı maliyeti artırır.'],
   ['Ayıp','ayı[pb](?:ı|ın|a|lı|lar|ları|larını)?','Satılan malın ya da yapılan işin olması gereken nitelikte olmaması, kusur. Tacirler arası satışta açık ayıp iki gün, görünmeyen ayıp sekiz gün içinde bildirilir (TTK 23).','e'],
   ['Iskarta','[ıi]skarta','Kullanılamayacak durumdaki şey. Sanayide hatalı olduğu için ayrılan parça; sebebi konuşulana kadar saklanır ve etiketlenir.'],
   ['Gönül koymak','gönül koy','Deyim: gücenmek, darılmak. Uzun süreli müşteri ya da tedarikçi çoğu zaman fiyattan değil tavırdan gönül koyar.'],
   ['Hayırlı olsun','hayırlı olsun','Anlaşmanın kapandığını bildiren söz; el sıkışmayla birlikte sanayide imzanın sözlü hâlidir. Aynı gün yazılı özetle teyit edilir.'],
   ['Şekil serbestisi','şekil serbesti','Kanun aksini söylemedikçe sözleşmenin belli bir biçime (yazılı, noter) bağlı olmaması (TBK 12). Sözlü anlaşma da sözleşmedir; sorun ispatıdır.'],
   ['İrade açıklaması','irade açıklama','Bir kişinin hukuki sonuç doğurmak üzere istediğini dışa vurması. Sözleşme, tarafların karşılıklı ve birbirine uygun irade açıklamalarıyla kurulur (TBK 1).'],
   ['Ret raporu','ret rapor','Müşterinin kalite kontrolünün partiyi neden kabul etmediğini, kusuru, adedi ve ölçü değerleriyle yazdığı belge. Rapor yoksa ret sözde kalır.'],
   ['Bakarız','bakarız','Çoğu zaman kibar bir hayır. Ayırt etmek için bir sonraki adım ya da gün istenir; gün verilmiyorsa cevap hayırdır.','e'],
   ['Şube','şube(?:si|sinin|sini|sine|sinde|ye|de|den|ler|leri|lerin|lerinin|nin|yi)?','Bir şirketin merkezi dışında, merkeze bağlı olarak satış ya da üretim yapan yeri. Ayrı bir tüzel kişi değildir; borcu, malı ve vergi numarası merkezin kendisidir.','e'],
   ['Tüzel kişi ortak','tüzel kişi ortak','Başka bir şirkete ortak olan şirket. Limited şirketin ortağı gerçek kişi de olabilir, başka bir şirket de.'],
   ['İştirak','iştirak(?:i|in|ini|e|te|ler|leri|lerin|lerde)?','Bir şirketin başka bir şirketteki payı; muhasebede genellikle yüzde 10 ile yüzde 50 arası paylar bu adla izlenir.','e'],
   ['Bağlı ortaklık','bağlı ortaklı[kğ]','Bir şirketin yüzde 50\'den fazla payına ya da yönetim çoğunluğunu seçme hakkına sahip olduğu başka şirket.'],
   ['Hakim şirket','hakim şirket','Başka bir şirketin oy haklarının çoğunluğuna sahip olan ya da yönetimini seçebilen şirket (TTK 195). Diğerine bağlı şirket denir.'],
   ['Şirketler topluluğu','şirketler topluluğ','Bir hakim şirket ile ona doğrudan ya da dolaylı bağlı en az iki şirketin oluşturduğu yapı.'],
   ['Tür değiştirme','tür değiştir','Bir ticaret şirketinin tüzel kişiliğini koruyarak başka bir şirket türüne dönüşmesi (ör. limitedden anonime). Tek kişinin şahıs işletmesi bu yolla şirkete dönüşemez.'],
   ['Aynî sermaye','ayn[îi] sermaye','Şirkete para yerine mal, hak ya da bütün bir işletme olarak konan sermaye.'],
   ['Asgari sermaye','asgari sermaye','Bir şirketin sahip olması gereken en az esas sermaye. 1 Ocak 2024\'ten beri limited şirkette 50 bin, anonim şirkette 250 bin lira.'],
   ['İştirak kazancı istisnası','iştirak kazanc','Tam mükellef bir şirketin, ortağı olduğu başka bir tam mükellef şirketten aldığı kâr payının kurumlar vergisinden istisna olması.'],
   ['İşyeri bildirgesi','işyeri bildirge','Bir işyerinde sigortalı çalıştırılmaya başlanmadan SGK\'ya verilen bildirim. Şube açılışında da ayrıca verilir.'],
   ['İşyeri sicil numarası','işyeri sicil numara','SGK\'nın her işyerine verdiği numara. Primler ve sigortalı bildirimleri bu numara üzerinden yapılır; farklı ildeki şube kendi numarasını alır.'],
   ['İşletmenin devri','işletme(?:nin|yi)? devr','Bir işletmenin makineleri, stoku, alacak ve borçlarıyla bir bütün olarak başkasına geçmesi. Devralan bildirim ya da ilandan itibaren borçlardan sorumlu olur, devreden iki yıl birlikte sorumlu kalır.'],
   ['Adi ortaklık','adi ortaklı[kğ]','Şirket kurmadan, bir sözleşmeyle ortak amaç için bir araya gelmek. Tüzel kişiliği yoktur; ortaklar borçlardan birlikte ve sınırsız sorumludur.'],
   ['Yerel ortak','yerel ortağ?','Başka bir ilde kurulan şirkete o bölgeyi tanıyan kişi olarak katılan ortak; çevre, işçi ve müşteri bilgisini getirir.'],
   ['Dilme','dilme(?:k|si|ye|de|den|hattı)?','Geniş bir sac rulosunu boyuna, daha dar şeritlere ayırma işlemi.','e'],
   ['Bobin','bobin(?:i|in|e|de|den|ler|leri|lerin)?','Rulo hâlinde sarılmış sac. Servis merkezleri bobini açıp levha ya da şerit hâline getirir.','e'],
   ['Ayrı şirket, bizi bağlamaz','bizi bağlamaz','Ortak olunan şirketin borcunun ana şirkete hiç dokunmadığı sanısı. Ticari borçta doğru, ödenmeyen vergi ve primde ve kefalette yanlıştır.'],
   ['Bilgi alma ve inceleme hakkı','bilgi alma ve inceleme','Limited şirkette her ortağın, payı ne olursa olsun, müdürlerden şirketin işleri ve hesapları hakkında bilgi isteme ve inceleme yapma hakkı (TTK 614). Ancak bilgi şirketin zararına kullanılacaksa gerektiği ölçüde sınırlanabilir.'],
   ['Özen ve sadakat','özen ve sadakat','Müdürün iki temel borcu: işini dikkatli yapmak ve şirketin çıkarını kendi çıkarının önüne koymak. Kanunda sadakat, bağlılık yükümlülüğü diye geçer.'],
   ['Bağlılık yükümlülüğü','bağlılık yükümlülü','Ortakların ve müdürlerin şirketin çıkarına zarar verecek davranışlardan kaçınma ve şirket sırlarını koruma borcu.'],
   ['Rekabet yasağı','rekabet yasağ','Müdürün, şirket sözleşmesinde aksi yoksa ya da ortaklar yazılı izin vermemişse şirketle rekabet eden bir işe girememesi.'],
   ['Ortak müdür','ortak müdür','Uzaktaki ortaklıkta bir ortağın yönetime kendi adına koyduğu ikinci müdür. Müşterek imzanın ikinci anahtarıdır; ama müdürlüğün bütün sorumluluğunu da taşır.'],
   ['Mizan','mizan','Muhasebedeki her hesabın toplam borç, toplam alacak ve kalan bakiyesini yan yana dizen tablo. Ayın kapandığının ve rakamların hazır olduğunun kanıtıdır.'],
   ['E-defter','e-defter','Yasal defterlerin kâğıt yerine elektronik ortamda, GİB\'in belirlediği biçimde tutulması ve mali mühürle imzalanması. Defter ay ay oluşturulur.'],
   ['Berat','berat(?:ı|ın|lar|ları|ların)?','E-defterin her ay için oluşturulan, mali mühürle imzalanıp GİB sistemine yüklenen özeti. Defterin o ay için kapandığını gösterir.','e'],
   ['Mali mühür','mali mühür','Şirketin elektronik belge ve defterlerini imzalamak için kullandığı elektronik sertifika. Tüzel kişinin elektronik imzası gibidir.'],
   ['Alacak yaşlandırması','alacak yaşlandırma','Müşteri alacaklarını vadesinden bu yana geçen güne göre gruplayan liste (0–30, 31–60, 60 gün üstü gibi). Geciken alacağı ilk bakışta gösterir.'],
   ['Stok sayımı','stok sayım','Depodaki malın tek tek sayılıp tartılarak kayıtla karşılaştırılması. Fark tutanağa geçer ve açıklanır; kötü niyet kadar kayıt hatasını da yakalar.'],
   ['Azami stok sınırı','azami stok','Ortakların yazılı onayı olmadan aşılamayacak stok miktarı. Fiyat beklentisiyle depoyu doldurup nakdi kilitlemeye karşı bir kilittir.'],
   ['Mali müşavir','mali müşavir','3568 sayılı Kanun\'a göre meslek mensubu: defter tutar, beyanname hazırlayıp imzalar, muhasebe ve vergi danışmanlığı verir. Yeminli mali müşavir ayrıca bazı tablo ve beyannameleri tasdik eder.'],
   ['Tasdik','tasdik','Yeminli mali müşavirin mali tabloların ya da beyannamenin mevzuata uygunluğunu inceleyip onaylaması. Tasdik ettiği kapsamda doğruluğundan sorumludur.'],
   ['Bağımsız denetim','bağımsız denetim','Şirketin finansal tablolarının yetkili bir denetçi tarafından denetim standartlarına göre incelenmesi. Belli büyüklüğü aşan şirketler için zorunludur; eşikleri Cumhurbaşkanı kararı belirler.'],
   ['Kamu Gözetimi Kurumu','kamu gözetimi','Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu (KGK). Bağımsız denetçileri yetkilendirir ve denetim standartlarını belirler.'],
   ['İzleyen kullanıcı','izleyen kullanıcı','Kurumsal internet şubesinde hesap hareketlerini görebilen ama para gönderemeyen kullanıcı. Uzaktaki ortaklığın hesaplarını izlemek için kullanılır.'],
   ['Güven ama doğrula','güven ama doğrula','Ortaklıkta kontrolün kişiye değil düzene bağlanması ilkesi: herkese, her ay, aynı biçimde ve karşılıklı uygulanan kontrol.'],
   ['Sahibinin gözü malı besler','sahibinin gözü','Eski söz: işin başında sahibi durmazsa iş gevşer, mal azalır. Uzaktaki işletmede gözün yerini rapor, banka ekranı, sayım ve ziyaret alır.'],
   ['Liste gelmeden stok yapmak','liste gelmeden','Erdemir\'in yeni dönem fiyat listesinde zam beklenirken mevcut fiyattan fazla sac alıp depolamak. Zam gelmezse nakit depoya kilitlenir.'],
   ['İlişkili kişi','ilişkili kişi','Şirketle arasında piyasa dışı bir bağ olan kişi ya da şirket: ortaklar, ortaklıklar, ortakların eşleri ve yakın akrabaları. Bunlarla yapılan işlemlerin fiyatı Kurumlar Vergisi Kanunu 13. maddeye göre ayrıca denetlenir.'],
   ['Transfer fiyatlandırması','transfer fiyatlandırma','Aynı gruptaki şirketlerin kendi aralarındaki alım satımda uyguladığı iç fiyat. Emsale aykırıysa kazanç örtülü dağıtılmış sayılır; işlemler beyanname ekindeki transfer fiyatlandırması formuyla bildirilir.'],
   ['Emsallere uygunluk ilkesi','emsallere uygunluk','İlişkili kişiyle yapılan işlemin fiyatının, aynı şartlarda ilişkisiz biriyle oluşacak fiyata uyması kuralı. Kısaca: yabancıya ne fiyat verirdin?'],
   ['İç emsal','iç emsal','Şirketin aynı malı ya da hizmeti ilişkisiz kişilerle hangi fiyattan alıp sattığı. Emsal fiyat aranırken önce buna bakılır.'],
   ['Dış emsal','dış emsal','Başka, birbirinden bağımsız şirketlerin benzer işlemlerindeki fiyat. İç emsal yoksa ya da güvenilir değilse kullanılır.'],
   ['Karşılaştırılabilir fiyat yöntemi','karşılaştırılabilir fiyat','Aynı ya da benzer malın ilişkisiz alıcıya satış fiyatını emsal alan yöntem. Sac gibi standart mallarda en güçlü yöntemdir.'],
   ['Maliyet artı yöntemi','maliyet artı','Maliyetin üstüne, şirketin ilişkisiz müşterilerine uyguladığı makul brüt kâr oranını ekleyerek emsal fiyatı bulan yöntem.'],
   ['Yeniden satış fiyatı yöntemi','yeniden satış fiyat','Malın ilişkisiz alıcıya son satış fiyatından satıcının normal brüt kâr payını düşerek ilişkili kişiden alış için emsal fiyatı bulan yöntem.'],
   ['Hazine zararı','hazine zarar','Emsale aykırı fiyat yüzünden tarafların toplam vergisinin eksik ya da geç tahakkuk etmesi. İki Türkiye şirketi arasında örtülü kazanç dağıtımı sayılması için gerekir.'],
   ['Dağıtılmış kâr payı','dağıtılmış k[âa]r pay','Örtülü kazanç ya da örtülü sermaye faizi gibi, adı konmadan aktarılan tutarın vergide kâr dağıtımı kabul edilmesi. Alan gerçek kişiyse stopaj gündeme gelir.'],
   ['Karşı tarafta düzeltme','karşı tarafta düzeltme','Örtülü kazanç tespitinden sonra, fazla vergi ödemiş olan karşı şirketin vergisinin düzeltilmesi. Ancak dağıtan şirket adına tarh edilen vergi kesinleşip ödendikten sonra yapılır.'],
   ['Yıllık transfer fiyatlandırması raporu','yıllık transfer fiyatlandırması rapor','İlişkili işlemlerde emsal analizinin ayrıntılı yazıldığı yıllık rapor. Büyük mükellefler yurt içi ve yurt dışı, diğerleri yalnız yurt dışı işlemler için hazırlar.'],
   ['Emsal faiz','emsal faiz','İlişkili kişiye verilen borç için uygulanması gereken, piyasa şartlarına uygun faiz. Önce şirketin kendi finansman maliyetine, yoksa Merkez Bankası oranları gibi dış göstergelere bakılır.'],
   ['Muvazaa','muvazaa','Tarafların gerçek iradesini gizleyen, gerçekte yapılmayan bir işi yapılmış gibi gösteren işlem. Muvazaalı fatura vergi suçu ve ortaklık davası riskidir.'],
   ['Denkleştirme','denkleştir','Hâkim şirketin bağlı şirkete verdirdiği kaybı aynı faaliyet yılı içinde telafi etmesi. Yapılmazsa bağlı şirketin ortakları tazminat isteyebilir.'],
   ['Cepten cebe','cepten cebe','Esnaf ağzı: kardeş şirketler arasında fiyat ne olursa olsun kimsenin zarar görmediği inancı. Diğer ortağın, alacaklının ve bazen hazinenin zararını görmez.'],
   ['Kilitlenme durumu','kilitlenme durum','Ortakların ya da müdürlerin önemli bir konuda karar alamaması ve şirketin bu yüzden yürüyemez hâle gelmesi. En sık yüzde 50-50 ortaklıklarda görülür; İngilizcesi deadlock.'],
   ['Salt çoğunluk','salt çoğunluk','Oyların yarısından fazlası. Yüzde 50 salt çoğunluk değildir; eşit paylı iki ortak ters düşerse karar çıkmaz.'],
   ['Üstün oy','üstün oy','Oylar eşit çıktığında bir kişinin, genellikle başkanın oyunun kararı belirlemesi. Limitedde müdürler kurulunda eşitlikte başkanın oyu üstündür (TTK 624).'],
   ['Pay devri','pay devr','Limited şirket ortaklık payının başkasına satılması ya da verilmesi. Yazılı yapılır, imzalar noterde onaylanır; sözleşmede aksi yoksa genel kurul onayıyla geçerli olur (TTK 595).'],
   ['Önalım hakkı','önalım','Bir ortak payını satmak isterse, payı önce diğer ortağa aynı fiyat ve şartlarla teklif etme yükümlülüğü. Şirket sözleşmesine yazılınca bağlayıcı olur.'],
   ['Şufa','şufa','Sanayide genellikle önalım hakkı anlamında kullanılır: satılacak pay ya da mülk önce ortağa teklif edilir.'],
   ['Alım hakkı','alım hakk','Belirli bir olay gerçekleşince (ör. ortağın ayrılması, kilitlenme) diğer ortağın payını önceden belirlenen şartlarla satın alabilme hakkı. Satıcının isteğine bakmaz.'],
   ['Birlikte satış hakkı','birlikte satış hakk','Çoğunluk ortağı payını üçüncü kişiye satarsa azınlığın da payını aynı fiyat ve şartlarla o kişiye satabilme hakkı.'],
   ['Satışa zorlama hakkı','satışa zorlama','Bütün şirket için alıcı çıktığında çoğunluk ortağının, azınlıktan da payını aynı fiyattan satmasını isteyebilme hakkı.'],
   ['Rus ruleti','rus rulet','Kilitlenmeyi çözen sözleşme maddesi: bir ortak fiyat söyler, diğeri ya o fiyattan satar ya da aynı fiyattan alır.'],
   ['Haklı sebep','haklı sebep','Ortaklık ilişkisinin devamını dürüstlük kuralına göre artık beklenemez kılan ağır durum. Çıkma, çıkarma ve fesih davalarının şartıdır; kanunda tek tek sayılmaz.'],
   ['Çıkma hakkı','çıkma hakk','Limitedde ortağın, şirket sözleşmesindeki şartlarla ya da haklı sebeple mahkeme kararıyla şirketten ayrılabilmesi (TTK 638).'],
   ['Ortaklıktan çıkarma','ortaklıktan çıkar','Şirketin bir ortağı istemi dışında ortaklıktan uzaklaştırması; sözleşmedeki sebeple genel kurul kararıyla ya da haklı sebeple mahkeme kararıyla olur (TTK 640).'],
   ['Ayrılma akçesi','ayrılma akçe','Limitedden çıkan ya da çıkarılan ortağa ödenen, payının gerçek değerine uyan para (TTK 641).'],
   ['Gerçek değer','gerçek değer','Bir payın, sicildeki nominal tutarı değil; şirketin varlıkları, kazanma gücü ve piyasa koşullarıyla bugün ettiği değer.'],
   ['Fesih davası','fesih dava','Ortağın, haklı sebeple şirketin sona erdirilmesini mahkemeden istemesi. Mahkeme fesih yerine davacıya payının değerini ödetip çıkarmak gibi başka bir çözüm de seçebilir (TTK 636).'],
   ['Tasfiye','tasfiye','Sona eren şirketin varlıklarının satılması, alacaklarının toplanması, borçlarının ödenmesi ve kalanın ortaklara dağıtılması süreci.'],
   ['Bilirkişi','bilirkişi','Mahkemenin teknik ya da mali bir konuda görüşüne başvurduğu uzman. Pay değeri gibi konular çoğunlukla bilirkişi raporuyla belirlenir.'],
   ['İhtiyari arabuluculuk','ihtiyari arabulucu','Kanun zorunlu kılmadığı hâlde tarafların kendi istekleriyle arabulucuya başvurması. Her uyuşmazlıkta, her aşamada mümkündür.'],
   ['Helalleşmek','helalleş','Ortaklık ya da alışveriş sona ererken hesapları kapatıp karşılıklı hak iddiasından vazgeçerek dostça ayrılmak. Yazılısı devir sözleşmesi ve karşılıklı ibradır.'],
   /* İşletme ve ticaret: devlet, oda ve siyaset */
   ['Yoklama','yoklama','Vergi dairesinin mükellefi ve vergiyle ilgili maddi olayları işyerinde yerinde tespit etmesi (VUK 127). Önceden haber verilmez; sonunda yoklama fişi düzenlenir, yoklama memurunun defter inceleme yetkisi yoktur.'],
   ['Vergi incelemesi','vergi incelemes','Ödenen verginin doğruluğunun defter, belge ve kayıtlar üzerinden araştırılması. Vergi müfettişi ya da vergi denetmeni gibi yetkili kişiler yapar; tam inceleme en çok bir yıl, sınırlı inceleme en çok altı ay sürer.'],
   ['İşyeri açma ve çalışma ruhsatı','işyeri açma ve çalışma ruhsat','Bir işyerinde belli bir faaliyetin yapılabileceğini gösteren izin. Kural olarak belediye, OSB sınırları içinde OSB verir.'],
   ['Gayrisıhhi müessese','gayrisıhhi müessese','Gürültü, duman, koku ya da yangın riski yüzünden çevresine zarar verebilecek işyeri. Üç sınıfa ayrılır; birinci sınıf konutlardan mutlaka uzak tutulur.'],
   ['Yapı kullanma izni','yapı kullanma izi','İnşaatı biten binanın projesine uygun yapıldığını ve kullanılabileceğini gösteren belge. Sanayide iskân diye anılır.'],
   ['İskân','iskân','Yapı kullanma izin belgesinin gündelik adı. Projede olmayan ek kısımlar iskânda yer almaz, kâğıt üstünde kaçak sayılır.'],
   ['Organize sanayi bölgesi','organize sanayi bölge','Sanayi tesislerinin planlı biçimde bir arada kurulduğu, altyapısı ortak, kendi tüzel kişiliği ve yönetimi olan bölge (OSB). İçindeki yapı ve işyeri ruhsatlarını OSB verir.'],
   ['OSBÜK','osbük','Organize Sanayi Bölgeleri Üst Kuruluşu. OSB\'lerin ortak sorunları ve bakanlıkla iletişimi için 2002\'de kurulan çatı kuruluş.'],
   ['İlan ve reklam vergisi','ilan ve reklam vergi','Belediye sınırları içindeki tabela ve reklamlardan alınan belediye vergisi. İşin sahibini ve türünü gösteren, ışıksız ve yarım metrekareyi aşmayan levha vergi dışıdır.'],
   ['İş müfettişi','iş müfettiş','Çalışma ve Sosyal Güvenlik Bakanlığı İş Teftiş Kurulu\'na bağlı denetçi. Ücret, çalışma süreleri ve iş sağlığı ve güvenliği kurallarını programlı ya da şikâyete bağlı teftişle denetler.'],
   ['Sosyal güvenlik denetmeni','sosyal güvenlik denetmen','SGK adına işyerlerinde sigortalı bildirimlerini ve primleri denetleyen görevli. Düzenlediği tutanak aksi ispat edilene kadar geçerlidir.'],
   ['İşin durdurulması','işin durdurulmas','Hayati tehlike görülen ya da çok tehlikeli metal, maden ve yapı işlerinde risk değerlendirmesi yapılmamış işyerinde işin kısmen veya tamamen durdurulması (6331 sayılı Kanun md. 25).'],
   ['Geçici faaliyet belgesi','geçici faaliyet belges','Çevre izni gereken işletmenin faaliyete başlamadan aldığı ilk belge. Bir yıl içinde asıl çevre izni tamamlanmalıdır.'],
   ['Tehlikeli atık','tehlikeli atık','Boya artığı, kirli filtre, atık yağ gibi çevre ve sağlık için zararlı atık. Ayrı ve etiketli biriktirilir, yalnız lisanslı firmaya verilir, geçici depoda en çok 180 gün kalır.'],
   ['Atık beyanı','atık beyan','Atık üreten işletmenin bir önceki yılın atıklarını her yıl en geç 31 Mart\'a kadar bakanlığın elektronik sistemi üzerinden bildirmesi.'],
   ['ÇED','çed','Çevresel etki değerlendirmesi. Listelerde yer alan yeni tesis ya da kapasite artışlarının çevreye etkisinin yatırımdan önce incelenmesi.','e'],
   ['Sanayi sicil belgesi','sanayi sicil','Sanayi ve Teknoloji Bakanlığı\'na kayıtlı üretici işletmeye verilen belge. Geçerliliği her yıl ilk dört ayda verilen yıllık işletme cetveline bağlıdır.'],
   ['Kapasite raporu','kapasite rapor','Odanın bilirkişilerince yerinde incelenerek hazırlanan, işletmenin makine parkını ve üretebileceği miktarı gösteren belge. Sicil, destek ve ihale başvurularında istenir.'],
   ['KOSGEB','kosgeb','Küçük ve Orta Ölçekli İşletmeleri Geliştirme ve Destekleme İdaresi. KOBİ\'lere dönemsel çağrılarla geri ödemeli ve geri ödemesiz destek verir; başvuru için veri tabanı kaydı ve güncel KOBİ bilgi beyannamesi gerekir.'],
   ['Eş finansman','eş finansman','Destek alınan projede maliyetin destek dışında kalan, işletmenin kendi koyduğu kısmı. Kalkınma ajanslarında özel sektör için destek genellikle maliyetin en fazla yarısıdır.'],
   ['Meslek grubu','meslek gru[bp]','Odada aynı ya da benzer işi yapan üyelerin toplandığı grup. Üye oyunu kendi grubunda kullanır; grup kendi meslek komitesini seçer.'],
   ['Meslek komitesi','meslek komite','Bir meslek grubunun dört yıl için seçtiği beş ya da yedi (büyük odalarda dokuz ya da on bir) kişilik kurul. Grubun sorunlarını konuşur, kararlarını odanın yönetim kuruluna iletir.'],
   ['Oda meclisi','oda meclis','Ticaret ve sanayi odasının en geniş karar organı. Üyeleri meslek komitelerinin içinden seçilir; yönetim kurulunu seçer.'],
   ['Kamu kurumu niteliğinde meslek kuruluşu','kamu kurumu niteliğinde meslek kuruluş','Kanunla kurulan, üyeliği zorunlu ve kamusal görevleri olan ama devlet dairesi olmayan kuruluş. Odalar ve borsalar bu türdendir.'],
   ['TOBB','tobb','Türkiye Odalar ve Borsalar Birliği. Ticaret, sanayi ve deniz ticaret odalarının ve ticaret borsalarının çatı kuruluşu.','e'],
   ['İlçe seçim kurulu','ilçe seçim kurul','Seçimleri yargı gözetiminde yöneten kurul. Oda seçimlerinde de seçmen listelerini askıya çıkarır, itirazları karara bağlar, sandığı yönetir.'],
   ['Askıdaki üye','askıdaki üye','Aidat borcu ya da adresinin bulunamaması gibi sebeplerle üyeliği yönetim kurulu kararıyla askıya alınmış oda üyesi. Adı seçmen listesinden silinir; borcun tamamını ödemeden geri dönemez.'],
   ['NACE kodu','nace','Avrupa\'da da kullanılan ekonomik faaliyet sınıflandırmasındaki kod. Odada hangi meslek grubunda yer alacağın büyük ölçüde buna göre belirlenir.','e'],
   ['Sektör meclisi','sektör meclis','TOBB bünyesinde bir sektörün ülke çapındaki sorunlarının konuşulduğu ve bakanlıklara rapor hazırlanan kurul.'],
   ['OSB','osb','Organize sanayi bölgesi. Kuruluşta müteşebbis heyet, sonra katılımcıların genel kurulu, yönetim kurulu, denetim kurulu ve bölge müdürlüğü tarafından yönetilir.','e'],
   ['Müteşebbis heyet','müteşebbis heyet','OSB\'nin kuruluş döneminde, kurucu kurumların temsilcilerinden oluşan yönetim organı. Bölgede yeterli işletme üretime geçince yerini genel kurula bırakır.'],
   ['İhracatçı birliği','ihracatçı birli','Aynı sektörde ihracat yapan firmaların 5910 sayılı Kanun\'la kurulan birliği. İhracatçı, ihraç ettiği ürünün birliğine üye olmak zorundadır; çatısı TİM\'dir.'],
   ['TİM','TİM','Türkiye İhracatçılar Meclisi. İhracatçı birliklerinin çatı kuruluşu.','ec'],
   ['Özelge','özelge','Gelir İdaresi\'nin, bir mükellefin kendi vergi durumuyla ilgili sorusuna verdiği yazılı ve resmî cevap (Vergi Usul Kanunu 413. madde).'],
   ['Evrak kayıt numarası','evrak kayıt','Bir kuruma verilen dilekçe ya da yazının kayda girdiğini ve tarihini gösteren numara. Sonradan "ne zaman bildirdiniz" sorusunun cevabıdır.'],
   ['Kurumsal hafıza','kurumsal hafıza','Bir kurumun, çalışanları değişse de arşivinde ve kayıtlarında sakladığı bilgi ve geçmiş.'],
   ['Dernek','derne[kğ]','En az yedi kişinin kanunla yasaklanmamış ortak bir amaç için kurduğu, tüzel kişiliği olan topluluk. Üyelik isteğe bağlıdır.'],
   ['Federasyon','federasyon','En az beş derneğin bir araya gelerek kurduğu üst kuruluş. En az üç federasyon da bir konfederasyon kurabilir.'],
   ['Resen kayıt','resen kay','Odaya kaydolması gerekirken bir ay içinde kaydolmayan tacirin oda tarafından kendiliğinden kaydedilmesi.'],
   ['Yıllık aidat','yıllık aidat','Oda üyesinin her yıl ödediği, meclisin onayladığı tarifeye göre belirlenen aidat. Haziran ve ekimde iki taksitte ödenir.'],
   ['Munzam aidat','munzam aidat','Ek aidat. Ticari kazancın ya da bilanço kârının binde beşi üzerinden hesaplanır, bir tavanı vardır; şubeler yarısını öder.'],
   ['Faaliyet belgesi','faaliyet belge','Firmanın odaya kayıtlı olduğunu ve faaliyetini sürdürdüğünü gösteren oda belgesi. Banka, ihale ve büyük müşteriler ister.'],
   ['Yerli malı belgesi','yerli malı belge','Bir malın yerli üretim olduğunu gösteren, oda aracılığıyla alınan belge. Kamu ihalelerinde yerli mala tanınan avantaj için kullanılır.'],
   ['SKR eksperi','skr eksper','Sanayi kapasite raporu eksperi. Kapasite raporu için işyerine bizzat gidip makineleri ve üretimi yerinde inceleyen uzman.'],
   ['Ticaret sicil tasdiknamesi','ticaret sicil tasdikname','Ticaret sicili müdürlüğünün, bir firmanın sicildeki kaydını onaylayan belgesi. MERSİS üzerinden online da istenebilir.'],
   ['EUR.1','eur\\.? ?1','Serbest ticaret anlaşması olan ülkelere ihracatta malın Türk menşeli olduğunu kanıtlayan, alıcıya indirimli vergi sağlayan dolaşım belgesi. İhracatçı doldurur, oda onaylar, gümrük vize eder.','e'],
   ['A.TR','a\\.tr','AB\'ye giden sanayi ürünlerinin Gümrük Birliği içinde serbest dolaşımda olduğunu gösteren belge. Menşe belgesi değildir; tarım ve demir-çelik ürünlerinde kullanılmaz.','e'],
   ['ATA karnesi','ata karne','Fuar malzemesi, numune ya da mesleki teçhizatın yurt dışına geçici götürülüp geri getirilmesinde gümrük teminatı yerine geçen belge. Türkiye\'de kefil kuruluş TOBB\'dur.'],
   ['AKÇT ürünleri','akçt','Avrupa Kömür Çelik Topluluğu\'ndan kalma listedeki kömür ve demir-çelik ürünleri. Gümrük Birliği kapsamında değildir; AB\'ye ihracatında A.TR yerine EUR.1 kullanılır.'],
   ['MEDOS','medos','Menşe ve Dolaşım Belgeleri Otomasyon Sistemi. EUR.1, A.TR ve menşe şahadetnamesi gibi belgelerin elektronik düzenlendiği TOBB sistemi.','e'],
   ['Fatura onayı','fatura onay','İhracat faturasının, bazı alıcı ülkelerin istemesi üzerine ticaret ve sanayi odası tarafından onaylanması.'],
   ['Tahkim','tahkim','Tarafların uyuşmazlığı mahkeme yerine kendi seçtikleri hakeme götürmesi. Hakemin kararı bağlayıcıdır; sözleşmede yazılı tahkim şartı gerekir.'],
   ['ISTAC','istac','İstanbul Tahkim Merkezi. 2014\'te kanunla kurulan, büyük ve uluslararası ticari uyuşmazlıklarda tahkim ve arabuluculuk hizmeti veren bağımsız kurum.','e'],
   ['Genç Girişimciler Kurulu','genç girişimciler kurul','TOBB koordinasyonunda illerde oda ve borsa bünyesinde çalışan istişari kurul. 18–40 yaş arası, sicilde kayıtlı tacirler ile şirket ortakları ve yöneticileri üye olabilir.'],
   ['Kadın Girişimciler Kurulu','kadın girişimciler kurul','TOBB koordinasyonunda illerde oda ve borsa bünyesinde çalışan, kadın girişimciliğini geliştirmeye yönelik istişari kurul.'],
   ['Vali','vali(?:m|si|sinin|sine|siyle|yi|ye|nin|ler|leri|lerin|lere|lik|liğe|liği|liğin|likte|likten)?','İlde genel idarenin başı. Cumhurbaşkanı kararıyla atanır; bakanlıkların ildeki birimleri onun gözetiminde çalışır.','e'],
   ['Kaymakam','kaymakam','İlçede genel idarenin başı. Seçilmez, atanır; ilçedeki kamu kurumlarını bir araya getirir.'],
   ['Belediye başkanı','belediye başkan','Belediye idaresinin başı ve belediye tüzel kişiliğinin temsilcisi. Halk tarafından beş yılda bir seçilir.'],
   ['Milletvekili','milletvekil','Türkiye Büyük Millet Meclisi\'nin 600 üyesinden biri. Kanun yapar, bütçeyi görüşür, yürütmeyi denetler; tek tek dosyaları değil bölgenin genel sorunlarını taşır.'],
   ['İl müdürü','il müdür','Bir bakanlığın ya da kurumun ildeki birimini yöneten atanmış yönetici. Sanayi sicili, çevre izni gibi teknik dosyalar onun masasında karara bağlanır.'],
   ['Bürokrat','bürokrat','Kamu kurumunda kurala ve hiyerarşiye bağlı çalışan atanmış görevli. Seçilmiş siyasetçiden farkı, seçmene değil üstüne ve mevzuata hesap vermesidir.'],
   ['Mülki amir','mülki amir','Vali ve kaymakam gibi, il ya da ilçede devletin genel idaresini yürüten atanmış yönetici.'],
   ['Makam ziyareti','makam ziyaret','Bir kamu yöneticisine resmî sıfatıyla, makamında, randevuyla yapılan kısa iş görüşmesi. Yanına hediye değil bir sayfalık dosya götürülür.'],
   ['Özel kalem','özel kalem','Vali, kaymakam, belediye başkanı gibi bir yöneticinin programını ve randevularını yürüten sekreterlik birimi.'],
   ['Ziyaret notu','ziyaret not','Bir makam ziyaretinden sonra aynı gün yazılan kısa kayıt: kimle görüşüldü, ne istendi, ne cevap alındı, kim neyi takip edecek.'],
   ['Protokol sırası','protokol sıra','Resmî tören ve açılışlarda makam sahiplerinin oturma ve konuşma sırası. Valilik ya da kaymakamlığın protokol biriminden sorulur.'],
   ['CİMER','cimer','Cumhurbaşkanlığı İletişim Merkezi. Kamuya dilek, şikâyet ve bilgi edinme başvurularının elektronik olarak yapıldığı kanal.'],
   ['Dilekçe','dilekçe','Bir kamu kurumuna yazılı olarak yapılan istek ya da şikâyet. Kanuna göre en geç 30 gün içinde gerekçeli cevap verilir; verildiği tarih ve sayı saklanır.'],
   ['Bilgi edinme hakkı','bilgi edinme','Kamu kurumundan bilgi ya da belge isteme hakkı. Kurum kural olarak 15 iş günü içinde cevap verir.'],
   ['Seçim yasakları','seçim yasak','Seçim süresince kamu kaynağının, kamu görevlisinin ve resmî törenlerin siyasette kullanılmasını önleyen kurallar. Başlangıç ve bitişini her seçim için YSK ilan eder.'],
   ['Siyasi tarafsızlık','siyasi tarafsızlı[kğ]','Memurun hiçbir partinin, kişinin ya da zümrenin yararını ya da zararını hedef tutan davranışta bulunmama yükümlülüğü.'],
   ['Çıkar çatışması','çıkar çatışma','Kamu görevlisinin tarafsızlığını etkileyen ya da etkiliyormuş gibi görünen kişisel durum. Görevli bu durumlardan kaçınmakla yükümlüdür.'],
   ['Soru önergesi','soru önerge','Milletvekilinin bir konuyu yazılı olarak ilgili bakana sorduğu meclis denetim aracı.'],
   ['Abimiz','abimiz','Sanayide bir makam sahibine yakınlık iddia eden hitap. Karşı tarafa baskı gibi duyulur, kayırma ve nüfuz şüphesi doğurur.'],
   ['Her devrin adamı','her devrin adam','Hangi yönetim gelirse ona yakın durarak iş yürüttüğünü söyleyen esnaf sözü. Dışarıdan "kuralla değil kişiyle çalışır" diye okunur.'],
   ['Rüşvet','rüşvet','Bir kamu görevlisine, görevi gereği bir işi yapması ya da yapmaması için doğrudan veya aracıyla menfaat sağlamak (TCK 252). Veren de alan da aynı cezayı alır; teklif de suçtur.'],
   ['İrtikap','irtikap','Kamu görevlisinin görevinin verdiği nüfuzu ya da güveni kötüye kullanarak birini zorlayıp veya kandırıp menfaat sağlaması (TCK 250). Para veren kural olarak mağdurdur.'],
   ['İcbar','icbar','Zorlama. İrtikapta görevlinin, kişiyi menfaat sağlamaya mecbur bırakması; işinin görülmeyeceği korkusuyla kendini mecbur hissetmek de buna girer.'],
   ['Nüfuz ticareti','nüfuz ticaret','Kamu görevlisi üzerinde nüfuzu olduğunu öne sürerek haksız bir iş için menfaat sağlamak (TCK 255). Aracı da parayı veren de cezalandırılır; nüfuzun gerçek olması gerekmez.'],
   ['İhaleye fesat karıştırma','ihaleye fesat','Kamu ihalesinin sonucunu hile, vaat, tehdit, nüfuz ya da istekliler arası anlaşmayla etkilemek (TCK 235). Ayrıca ihalelerden yasaklama sebebidir.'],
   ['Edimin ifasına fesat','edimin ifasına fesat','Kamuya karşı üstlenilen işi hileyle farklı ya da eksik yapmak; ör. şartnamede belirtilenden başka malı teslim etmek (TCK 236).'],
   ['Görevi kötüye kullanma','görevi kötüye kullan','Kamu görevlisinin görevinin gereklerine aykırı davranarak kamu zararına ya da birine haksız menfaate yol açması (TCK 257).'],
   ['Etkin pişmanlık','etkin pişmanlı[kğ]','Suça katılan kişinin, resmî makamlar haberdar olmadan önce durumu bildirmesi hâlinde cezasının kalkması ya da azalması. Rüşvette TCK 254\'te düzenlenir.'],
   ['Kamu görevlisi','kamu görevli','Kamusal bir faaliyete atanarak, seçilerek ya da başka yolla katılan kişi. Memur, müfettiş, belediye görevlisi, seçilmiş yerel yönetici bu kapsamdadır.'],
   ['Müşterek fail','müşterek fail','Bir suçu başkasıyla birlikte işleyen kişi. Kanun bazı durumlarda aracıyı ya da şirketin yetkilisini de müşterek fail sayar ve asıl fail gibi cezalandırır.'],
   ['Güvenlik tedbiri','güvenlik tedbir','Cezadan ayrı olarak mahkemenin verdiği önlem. Şirketlere hapis verilmez ama faaliyet izninin iptali ve müsadere gibi tedbirler uygulanabilir (TCK 60).'],
   ['Müsadere','müsadere','Suçtan elde edilen kazanca ya da suçta kullanılan şeylere mahkeme kararıyla devletin el koyması.','e'],
   ['İhalelere katılmaktan yasaklama','ihalelere katılmaktan yasakla','Kamu İhale Kanunu\'ndaki yasak fiilleri işleyenlerin belli bir süre kamu ihalelerine girememesi; yasak fiillerde bir yıldan iki yıla kadar.'],
   ['Kamu Görevlileri Etik Kurulu','etik kurul','Kamu görevlilerinin uyması gereken etik davranış ilkelerini belirleyen ve üst düzey görevliler hakkındaki etik ihlal başvurularını inceleyen kurul.'],
   ['Ayni bağış','ayni bağış','Para yerine mal, hizmet ya da kullanım hakkı olarak yapılan bağış. Siyasi partilere yapılan ayni bağış da yıllık bağış sınırına sayılır.'],
   ['Hazineye gelir kaydı','hazineye gelir kayd','Kanuna aykırı elde edilen bir tutarın devlete aktarılması. Sınırı aşan ya da yasak kaynaktan gelen parti bağışları için Anayasa Mahkemesi bu kararı verir.'],
   ['Hediye ve davet defteri','hediye ve davet defter','Şirketin verdiği ve aldığı her hediyenin ve davetin tarih, kişi, değer, sebep ve onaylayanla yazıldığı iç kayıt. Hem önceden düşündürür hem sonradan kanıt olur.'],
   ['Her kapıyı açan','her kapıyı açan','Kamu kurumlarında tanıdığı olduğunu söyleyip para karşılığı iş çözmeyi teklif eden aracı için kullanılan söz. Teklifi kabul etmek nüfuz ticaretine ortak olmaktır.'],
   ['Soruşturma','soruştur','Bir suç şüphesini öğrenen savcılığın, dava açmaya yer olup olmadığına karar vermek için yürüttüğü araştırma evresi. Bu evredeki işlemler kural olarak gizlidir.'],
   ['Şüpheli','şüpheli(?:ye|yi|nin|ler|lerin|den)?','Soruşturma evresinde hakkında suç şüphesi bulunan kişi. Susma ve müdafi seçme hakkı vardır; dava açılınca sanık adını alır.','e'],
   ['Tanık','tanık','Bir olay hakkında bildiklerini anlatmak üzere dinlenen kişi. Çağrıya uymak ve doğruyu söylemek zorundadır; kendisini ya da yakınlarını suçlayabilecek sorulara cevap vermeyebilir (CMK 48).'],
   ['Müdafi','müdafi','Ceza soruşturmasında ve davasında şüpheliyi ya da sanığı savunan avukat. Seçilemiyorsa istem üzerine baro görevlendirir (CMK 150).'],
   ['Susma hakkı','susma hakkı','Şüphelinin kendisine yüklenen suç hakkında açıklama yapmak zorunda olmaması (CMK 147). Kimlik sorularına ise doğru cevap vermek zorunludur.'],
   ['Kovuşturmaya yer olmadığına dair karar','kovuşturmaya yer olmadığı','Savcının, dava açmaya yetecek şüphe oluşturan delil bulamadığında verdiği karar (CMK 172). Halk arasında takipsizlik denir; zarar görenin on beş gün içinde itiraz hakkı vardır.'],
   ['Takipsizlik','takipsizlik','Kovuşturmaya yer olmadığına dair kararın halk arasındaki adı. Kesinleşmeden "temize çıktık" denmez.'],
   ['Kısıtlama kararı','kısıtlama kararı','Avukatın soruşturma dosyasını inceleme yetkisinin, savcının istemiyle sulh ceza hâkimi kararıyla sınırlanması (CMK 153). Halk arasında "gizlilik kararı" denir; ifade tutanaklarını kapsamaz.'],
   ['Soruşturmanın gizliliği','soruşturmanın gizliliğ','Soruşturma evresindeki işlemlerin, savunma haklarına zarar vermemek koşuluyla gizli olması (CMK 157). Bu gizliliği alenen ihlal etmek suçtur (TCK 285).'],
   ['Delil karartma','delil kart','Gerçeğin ortaya çıkmasını engellemek için bir suçun delillerini silmek, gizlemek ya da değiştirmek. Ayrı bir suçtur (TCK 281) ve şüphesi tutuklama nedenidir.'],
   ['El koyma','el ?koy','Soruşturma ya da kovuşturmada bir eşyanın, hesabın, taşınmazın ya da ortaklık payının hâkim kararıyla devletin denetimine alınması (CMK 128).'],
   ['Sulh ceza hâkimliği','sulh ceza hâkim','Soruşturma evresinde arama, el koyma, kısıtlama gibi kararları veren ve takipsizlik kararına itirazı inceleyen hâkimlik.'],
   ['Erişimin engellenmesi','erişimin engellen','İnternetteki bir içeriğe Türkiye\'den ulaşılmasının kararla durdurulması. Özel hayatın gizliliği için 5651 sayılı Kanun\'un 9/A maddesi kısa süreli bir yol öngörür.'],
   ['Kesinleşme şerhi','kesinleşme şerh','Bir kararın üzerine, artık itiraz ya da kanun yolu kalmadığını gösteren onaylı not. Takipsizlik ve beraat kararı bu şerhle saklanır.'],
   ['Disiplin hapsi','disiplin hapsi','Haklı sebep olmadan tanıklıktan çekinen kişiye, tanıklık yapılıncaya kadar ve en çok üç ay verilebilen zorlama hapsi (CMK 60).'],
   ['Tek sözcü','tek sözcü','Kriz anında firma adına yalnız bir yetkili kişinin konuşması ilkesi. Diğer herkes muhabiri ona yönlendirir.'],
   ['Ekran görüntüsü','ekran görüntü','Telefon ya da bilgisayar ekranının kaydedilmiş resmi. Silinen paylaşımı kalıcı hâle getirir; tarih ve bağlam çoğu zaman görünmez.'],
   ['Savcılıkta adamım var','savcılıkta adamım','Aracının soruşturmayı etkileyebileceği iddiası. Ya yalandır ya nüfuz ticaretidir; teşekkür edilip geri çevrilir, not alınır, avukata bildirilir.'],
   ['Dumansız ateş olmaz','dumansız ateş','Adı soruşturmada geçen herkesin suçlu olduğu kanısını anlatan söz. Tartışılmaz; belgeyle ve sonradan kesinleşmiş kararla cevap verilir.']
  ];
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function wrapTerms(scope){
    var used=[], hepsi=scope.textContent, ps=null;
    G.forEach(function(g,gi){
      var o=g[3]||''; var re; try{re=new RegExp('(^|[^\\p{L}])('+g[1]+(o.indexOf('e')>-1?')(?![\\p{L}])':'[\\p{L}]*)'),(o.indexOf('c')>-1?'u':'iu'))}catch(e){return}
      if(!re.test(hepsi)) return; /* bölümde hiç geçmiyorsa paragrafları gezme */
      if(!ps) ps=scope.querySelectorAll('p, li');
      for(var i=0;i<ps.length;i++){
        var el=ps[i]; if(el.closest('.fine,.side,details,.sum,.nav')) continue;
        var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null), n;
        while((n=w.nextNode())){
          if(n.parentNode.closest('.term,a,button,summary,code,pre')) continue;
          var m=re.exec(n.nodeValue); if(!m) continue;
          var start=m.index+m[1].length, word=m[2];
          var after=n.splitText(start); after.nodeValue=after.nodeValue.slice(word.length);
          var s=document.createElement('span'); s.className='term'; s.tabIndex=0; s.setAttribute('role','button');
          s.dataset.gi=gi; s.textContent=word; after.parentNode.insertBefore(s,after);
          used.push(gi); return;
        }
      }
    });
    return used;
  }
  function addWordList(ch,used){
    if(!used.length||ch.querySelector('.words')) return;
    var end=ch.querySelector('.end'); if(!end) return;
    var h='<div class="eyebrow">Bu bölümdeki kelimeler</div><dl class="words">';
    used.slice().sort(function(a,b){return G[a][0].localeCompare(G[b][0],'tr')}).forEach(function(gi){h+='<div><dt>'+esc(G[gi][0])+'</dt><dd>'+esc(G[gi][2])+'</dd></div>'});
    var box=document.createElement('div'); box.innerHTML=h+'</dl>';
    var nav=end.querySelector('.nav'); end.insertBefore(box,nav);
  }
  /* Kelimeler yalnızca açılan bölümde işaretlenir; hepsini açılışta yapmak telefonda saniyelerce donduruyordu */
  function terimle(ch){ if(!ch||ch.dataset.terim||ch.classList.contains('ders')) return; ch.dataset.terim='1';
    setTimeout(function(){ addWordList(ch,wrapTerms(ch)); },60); /* önce sayfa görünsün, kelimeler ardından */ }
  var pano=document.querySelector('.pano'); if(pano) wrapTerms(pano);

  var box=document.getElementById('defbox');
  function show(gi){document.getElementById('def-t').textContent=G[gi][0];document.getElementById('def-d').textContent=G[gi][2];box.hidden=false}
  document.addEventListener('click',function(e){
    var t=e.target.closest('.term'); if(t){show(+t.dataset.gi);return}
    if(e.target.id==='def-x'||!e.target.closest('#defbox')) box.hidden=true;
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') box.hidden=true;
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('term')){e.preventDefault();show(+e.target.dataset.gi)}
  });

  window.DNI={G:G,names:names,files:files};

  /* ---- okuma takibi ve yönlendirme ---- */
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var done=get('dni-done')||{};
  function paint(){
    document.querySelectorAll('.side a[data-ch]').forEach(function(a){a.classList.toggle('done',!!done[a.dataset.ch])});
    document.querySelectorAll('button[data-done]').forEach(function(b){b.textContent=done[b.dataset.done]?'Okundu ✓':'Bu bölümü okudum'});
    var last=get('dni-last'), r=document.getElementById('resume');
    if(last&&names[last]){r.innerHTML='Kaldığın yer: <a href="#'+last+'">'+names[last]+'</a>';r.classList.add('on')}
  }
  function route(){
    if(sayfaYonlendir()) return;
    var h=(location.hash||'#ev').slice(1), m=h.match(/^([a-z]+)-(\d+)$/);
    document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});
    var crumb=document.getElementById('crumb'); box.hidden=true;
    if(m&&files[m[1]]&&document.getElementById('c-'+h)){
      document.getElementById('v-'+m[1]).classList.add('on');
      document.querySelectorAll('#v-'+m[1]+' .chapter').forEach(function(c){c.style.display=(c.id==='c-'+h)?'block':'none'});
      terimle(document.getElementById('c-'+h));
      document.querySelectorAll('.side a[data-ch]').forEach(function(a){a.classList.toggle('cur',a.dataset.ch===h)});
      crumb.textContent=files[m[1]].title+' · Bölüm '+m[2];
      set('dni-last',h);
    } else if(h!=='ev' && h!=='pano' && !files[h] && /^[a-z]+$/.test(h) && document.getElementById('v-'+h)){
      document.getElementById('v-'+h).classList.add('on'); crumb.textContent=document.getElementById('v-'+h).getAttribute('data-title')||h;
    } else if(h==='pano'){
      document.getElementById('v-pano').classList.add('on'); crumb.textContent='Ekim 2026 panosu';
    } else {
      document.getElementById('v-ev').classList.add('on'); crumb.textContent='Kütüphane';
    }
    paint(); bolumBasi(m&&document.getElementById('c-'+h));
  }
  /* Bölüm açılınca metnin başına in (telefonda bölüm listesi üstte kalıyordu); kaldığın yer varsa ek.html oraya götürür. */
  function bolumBasi(c){ window.scrollTo(0, c ? Math.max(0,Math.round(c.getBoundingClientRect().top+window.scrollY-12)) : 0); }
  document.addEventListener('click',function(e){
    var a=e.target.closest('.side a[data-ch]'); if(!a||('#'+a.dataset.ch)!==location.hash) return;
    e.preventDefault(); bolumBasi(document.getElementById('c-'+a.dataset.ch)); /* açık bölüme yeniden dokununca da metne in */
  });
  document.addEventListener('click',function(e){var b=e.target.closest('button[data-done]');if(!b)return;var k=b.dataset.done;done=get('dni-done')||{};if(done[k])delete done[k];else{var t=new Date();if(t.getHours()<4)t.setDate(t.getDate()-1);done[k]=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2)}set('dni-done',done);paint()});
  window.addEventListener('hashchange',route); route();
})();
</script>
