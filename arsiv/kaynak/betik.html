  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function wrapTerms(scope){
    var used=[];
    G.forEach(function(g,gi){
      var o=g[3]||''; var re; try{re=new RegExp('(^|[^\\p{L}])('+g[1]+(o.indexOf('e')>-1?')(?![\\p{L}])':'[\\p{L}]*)'),(o.indexOf('c')>-1?'u':'iu'))}catch(e){return}
      var ps=scope.querySelectorAll('p, li');
      for(var i=0;i<ps.length;i++){
        var el=ps[i]; if(el.closest('.fine,.side,details,.sum,.nav')) continue;
        var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null), n;
        while((n=w.nextNode())){
          if(n.parentNode.closest('.term,a,button,summary')) continue;
          var m=re.exec(n.nodeValue); if(!m) continue;
          var start=m.index+m[1].length, word=m[2];
          var after=n.splitText(start); after.nodeValue=after.nodeValue.slice(word.length);
          var s=document.createElement('span'); s.className='term'; s.tabIndex=0; s.setAttribute('role','button');
          s.dataset.gi=gi; s.textContent=word; after.parentNode.insertBefore(s,after);
          used.push(gi); return;
        }
      }
    });
    return used;
  }
  function addWordList(ch,used){
    if(!used.length||ch.querySelector('.words')) return;
    var end=ch.querySelector('.end'); if(!end) return;
    var h='<div class="eyebrow">Bu bölümdeki kelimeler</div><dl class="words">';
    used.slice().sort(function(a,b){return G[a][0].localeCompare(G[b][0],'tr')}).forEach(function(gi){h+='<div><dt>'+esc(G[gi][0])+'</dt><dd>'+esc(G[gi][2])+'</dd></div>'});
    var box=document.createElement('div'); box.innerHTML=h+'</dl>';
    var nav=end.querySelector('.nav'); end.insertBefore(box,nav);
  }
  document.querySelectorAll('.chapter:not(.ders)').forEach(function(ch){addWordList(ch,wrapTerms(ch))});
  var pano=document.querySelector('.pano'); if(pano) wrapTerms(pano);

  var box=document.getElementById('defbox');
  function show(gi){document.getElementById('def-t').textContent=G[gi][0];document.getElementById('def-d').textContent=G[gi][2];box.hidden=false}
  document.addEventListener('click',function(e){
    var t=e.target.closest('.term'); if(t){show(+t.dataset.gi);return}
    if(e.target.id==='def-x'||!e.target.closest('#defbox')) box.hidden=true;
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') box.hidden=true;
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('term')){e.preventDefault();show(+e.target.dataset.gi)}
  });

  window.DNI={G:G,names:names,files:files};

  /* ---- okuma takibi ve yönlendirme ---- */
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var done=get('dni-done')||{};
  function paint(){
    document.querySelectorAll('.side a[data-ch]').forEach(function(a){a.classList.toggle('done',!!done[a.dataset.ch])});
    document.querySelectorAll('button[data-done]').forEach(function(b){b.textContent=done[b.dataset.done]?'Okundu ✓':'Bu bölümü okudum'});
    var last=get('dni-last'), r=document.getElementById('resume');
    if(last&&names[last]){r.innerHTML='Kaldığın yer: <a href="#'+last+'">'+names[last]+'</a>';r.classList.add('on')}
  }
  function route(){
    if(sayfaYonlendir()) return;
    var h=(location.hash||'#ev').slice(1), m=h.match(/^([a-z]+)-(\d+)$/);
    document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});
    var crumb=document.getElementById('crumb'); box.hidden=true;
    if(m&&files[m[1]]&&document.getElementById('c-'+h)){
      document.getElementById('v-'+m[1]).classList.add('on');
      document.querySelectorAll('#v-'+m[1]+' .chapter').forEach(function(c){c.style.display=(c.id==='c-'+h)?'block':'none'});
      document.querySelectorAll('.side a[data-ch]').forEach(function(a){a.classList.toggle('cur',a.dataset.ch===h)});
      crumb.textContent=files[m[1]].title+' · Bölüm '+m[2];
      set('dni-last',h);
    } else if(h!=='ev' && h!=='pano' && !files[h] && /^[a-z]+$/.test(h) && document.getElementById('v-'+h)){
      document.getElementById('v-'+h).classList.add('on'); crumb.textContent=document.getElementById('v-'+h).getAttribute('data-title')||h;
    } else if(h==='pano'){
      document.getElementById('v-pano').classList.add('on'); crumb.textContent='Ekim 2026 panosu';
    } else {
      document.getElementById('v-ev').classList.add('on'); crumb.textContent='Kütüphane';
    }
    paint(); window.scrollTo(0,0);
  }
  document.addEventListener('click',function(e){var b=e.target.closest('button[data-done]');if(!b)return;var k=b.dataset.done;done=get('dni-done')||{};if(done[k])delete done[k];else{var t=new Date();if(t.getHours()<4)t.setDate(t.getDate()-1);done[k]=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2)}set('dni-done',done);paint()});
  window.addEventListener('hashchange',route); route();
})();
</script>
