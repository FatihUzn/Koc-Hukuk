<!-- Ek özellikler: arama, sözlük, kaldığın yer, günlük beş soru. Görünümler betik tarafından .shell içine taşınır. -->
<style>
.ders .kural,.ders .orn,.ders .hata,.ders .bag,.ders .ozet{border-radius:14px;padding:16px 20px;margin:22px 0;background:var(--paper);border:1px solid var(--line)}
.ders .kural{border-left:4px solid var(--lav)}
.ders .orn{border-left:4px solid var(--mint)}
.ders .hata{border-left:4px solid var(--amber)}
.ders .bag{border-style:dashed}
.ders .ozet{background:var(--lav-soft)}
.ders .et{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)}
.ders .kural .et{color:var(--lav)}.ders .orn .et{color:var(--mint)}.ders .hata .et{color:var(--amber)}
.ders .kural p:last-child,.ders .orn p:last-child,.ders .hata p:last-child,.ders .bag p:last-child,.ders .ozet>:last-child{margin-bottom:0}
.ders .kural p,.ders .orn p,.ders .hata p,.ders .bag p{margin:0 0 10px}
.ders u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--lav)}
.ders .cumle{display:block;margin:10px 0;padding:8px 0 8px 14px;border-left:2px solid var(--line);font-style:italic;color:var(--strong)}
.ders table{width:100%;border-collapse:collapse;margin:20px 0;font-size:16px;line-height:1.5}
.ders th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:2px solid var(--line)}
.ders td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.ders .tablo{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ders figure{margin:26px 0;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.ders figure svg{display:block;width:100%;height:auto}
.kes{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.92em;margin:0 3px}
.kes>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px 1px}
.kes>span:last-child{padding:1px 4px 0}
.ders .mat{display:block;margin:12px 0;padding:10px 14px;background:var(--bg);border-radius:10px;font-size:17.5px;overflow-x:auto;white-space:nowrap}
.ders .mat .g{color:var(--muted);font-size:14px;margin-left:14px;white-space:normal}
/* Kod ve siber dersleri: kod bloğu, terminal çıktısı, satır içi kod */
.ders pre.kod,.ders pre.cikti{margin:12px 0;padding:12px 14px;border-radius:10px;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre;tab-size:4}
.ders pre.kod{background:var(--bg);border:1px solid var(--line);color:var(--strong)}
.ders pre.cikti{background:var(--mint-soft);border-left:3px solid var(--mint);color:var(--fg)}
.ders pre.kod[data-ad]::before,.ders pre.cikti::before{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ders pre.kod[data-ad]::before{content:attr(data-ad)}
.ders pre.cikti::before{content:"Çıktı"}
.ders :not(pre)>code{font-family:var(--mono);font-size:.9em;padding:1px 5px;border-radius:5px;background:var(--bg2)}
.ders figure{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ders figure svg.genis{min-width:600px}
.ders figcaption{margin-top:10px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.sv-k{fill:var(--paper);stroke:var(--line);stroke-width:1.5}.sv-l{fill:var(--lav-soft);stroke:var(--lav);stroke-width:1.5}.sv-m{fill:var(--mint-soft);stroke:var(--mint);stroke-width:1.5}.sv-a{fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.5}
.sv-t{fill:var(--strong);font-family:var(--body);font-size:14px}.sv-s{fill:var(--muted);font-family:var(--body);font-size:12px}.sv-b{fill:var(--strong);font-family:var(--body);font-size:15px;font-weight:700}
.sv-c{stroke:var(--muted);stroke-width:1.5;fill:none}.sv-cl{stroke:var(--lav);stroke-width:2;fill:none}
.quiz{margin:40px 0 10px;padding:22px 22px 14px;border:1px solid var(--lav);border-radius:18px;background:var(--paper)}
.quiz .qb{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.quiz h3{margin:0;font-size:22px;color:var(--strong)}
.quiz .puan{font-family:var(--mono);font-size:13px;color:var(--lav)}
.quiz .qa{margin:0 0 14px;font-size:15px;color:var(--muted)}
.quiz ol.qs{list-style:none;margin:0;padding:0;counter-reset:q}
.quiz ol.qs>li{counter-increment:q;padding:18px 0;border-top:1px solid var(--line)}
.quiz ol.qs>li>.q::before{content:counter(q) ". ";font-weight:700;color:var(--lav)}
.quiz .q{margin:0 0 10px;font-size:17.5px;line-height:1.6;color:var(--strong)}
.quiz .eski{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mint);border:1px solid var(--mint);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.quiz ul.sec{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.quiz ul.sec button{width:100%;text-align:left;font:inherit;font-size:16.5px;line-height:1.5;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px}
.quiz ul.sec button b{flex:none;font-family:var(--mono);font-weight:500;color:var(--muted)}
.quiz ul.sec button:disabled{cursor:default;opacity:1}
.quiz ul.sec button.dogru{border-color:var(--mint);background:var(--mint-soft);color:var(--strong)}
.quiz ul.sec button.yanlis{border-color:var(--amber);background:var(--amber-soft);color:var(--strong)}
.quiz .coz{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:16px;line-height:1.6}
.quiz .coz[hidden]{display:none}
.quiz .coz b.s{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);display:block;margin-bottom:4px}
.quiz .coz b.s.y{color:var(--amber)}
.quiz .qalt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;font-size:15px;color:var(--muted)}
.quiz .qalt button{font:inherit;font-size:14px;font-weight:600;color:var(--lav);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.gv{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:none;font-style:normal;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;white-space:nowrap}
.gv.g-d{color:var(--mint);border-color:var(--mint)}
.gv.g-h{color:var(--amber);border-color:var(--amber)}
a.gv{text-decoration:none;cursor:pointer;font-size:10.5px;padding:3px 9px}
mark.vurgu{background:rgba(242,185,107,.38);color:inherit;border-radius:3px;padding:1px 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.vdugme{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;font:inherit;font-size:14.5px;font-weight:600;color:var(--strong);background:var(--paper);border:1px solid var(--amber);border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 14px 36px -14px rgba(0,0,0,.8)}
.vdugme[hidden]{display:none}
.notum{margin:34px 0 10px;border-top:1px solid var(--line);padding-top:20px}
.notum h4{margin:0 0 10px}
.notum ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.notum li{font-size:15.5px;line-height:1.55;color:var(--fg);border-left:3px solid var(--amber);padding:2px 0 2px 12px;cursor:pointer}
.notum textarea{width:100%;min-height:96px;font:inherit;font-size:16px;line-height:1.55;color:var(--strong);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;resize:vertical}
.notum textarea:focus{border-color:var(--lav)}
.notum .ip{font-size:13px;color:var(--muted);margin:6px 2px 0}
.arac{margin:26px 0 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.ara{position:relative;max-width:640px}
.ara input{width:100%;font:inherit;font-size:17px;color:var(--strong);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;outline:none}
.ara input:focus{border-color:var(--lav)}
.ara input::placeholder{color:var(--muted)}
.sonuc{display:grid;gap:8px;max-width:760px}
.sonuc a{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.sonuc a:hover{border-color:var(--lav)}
.sonuc .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.sonuc p{margin:4px 0 0;font-size:15.5px;line-height:1.55;color:var(--fg)}
.sonuc mark{background:rgba(185,167,245,.3);color:var(--strong);border-radius:3px;padding:0 2px}
.sonuc .yok{color:var(--muted);font-size:15px;padding:4px 2px}
.kisayol{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;max-width:760px}
.bulundu{animation:bulundu 2.6s ease}
@keyframes bulundu{0%,60%{background:rgba(185,167,245,.22);box-shadow:0 0 0 8px rgba(185,167,245,.22);border-radius:6px}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.tost{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;background:var(--paper);border:1px solid var(--lav);border-radius:999px;padding:9px 10px 9px 18px;font-size:14.5px;color:var(--fg);display:flex;gap:12px;align-items:center;box-shadow:0 14px 36px -14px rgba(0,0,0,.8);max-width:calc(100vw - 32px)}
.tost[hidden]{display:none}
.tost button{font:inherit;font-size:13.5px;font-weight:600;color:var(--lav);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.dar{max-width:680px}
.dar h1 em{color:var(--lav)}
.sk{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;margin-top:22px}
.sk .ust{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.sk .ust b{color:var(--mint);font-weight:500}
.sk .q{font-size:22px;line-height:1.45;font-weight:500;color:var(--strong);margin:0 0 18px}
.sk .a{border-left:3px solid var(--mint);background:var(--mint-soft);border-radius:0 12px 12px 0;padding:14px 18px;margin:0 0 18px;font-size:17px;line-height:1.7}
.sk .a p{margin:0}
.sk .dg{display:flex;flex-wrap:wrap;gap:10px}
.sk .bitti{font-family:var(--display);font-style:italic;font-size:26px;color:var(--strong);margin:0 0 8px}
.szf{max-width:420px;margin:18px 0 6px}
</style>

<div class="view" id="v-sozluk" data-title="Sözlük">
  <div class="dar">
    <div class="eyebrow">Başvuru</div>
    <h1>Bütün <em>kelimeler</em></h1>
    <p class="lede">Bölümlerde altı noktalı geçen her kelime burada. Yazarak süz.</p>
    <div class="ara szf"><input type="search" id="sz-ara" placeholder="Kelime ara" autocomplete="off" aria-label="Sözlükte ara"></div>
    <dl class="words" id="sz-liste"></dl>
    <p><a class="home" href="#ev">← Kütüphaneye dön</a></p>
  </div>
</div>

<div class="view" id="v-soru" data-title="Günlük beş soru">
  <div class="dar">
    <div class="eyebrow">Tekrar</div>
    <h1>Günlük <em>beş soru</em></h1>
    <p class="lede">Okuduğun bölümlerin sonundaki sorular, unutmaya yakınken geri gelir. Bildiğin soru daha geç, bilemediğin yarın yeniden sorulur.</p>
    <div class="sk" id="soru-kart"></div>
    <p style="margin-top:22px"><a class="home" href="#ev">← Kütüphaneye dön</a></p>
  </div>
</div>

<button type="button" class="vdugme" id="vdugme" hidden>Vurgula</button>
<div class="tost" id="tost" hidden><span id="tost-m"></span><button type="button" id="tost-b"></button></div>

<script>
(function(){
  var shell=document.querySelector('.shell');
  ['v-sozluk','v-soru'].forEach(function(id){ var v=document.getElementById(id); if(v&&shell) shell.appendChild(v); });
  function oku(k,v){try{var x=localStorage.getItem(k);return x==null?v:JSON.parse(x)}catch(e){return v}}
  function yaz(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function kucuk(s){return String(s).toLocaleLowerCase('tr')}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function gunAd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function bugun(ek){var d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);if(ek)d.setDate(d.getDate()+ek);return gunAd(d)}
  var G=(window.DNI&&window.DNI.G)||[], adlar=(window.DNI&&window.DNI.names)||{}, dosyalar=(window.DNI&&window.DNI.files)||{};
  function bolumAdi(id){var m=id.match(/^([a-z]+)-(\d+)$/);return m&&dosyalar[m[1]]?dosyalar[m[1]].title+' · Bölüm '+m[2]:id}

  /* ---------- ana sayfa: arama + kısayollar ---------- */
  var ev=document.getElementById('v-ev'), resume=document.getElementById('resume');
  var arac=document.createElement('div'); arac.className='arac';
  arac.innerHTML='<div class="ara"><input type="search" id="ara" placeholder="Bütün bölümlerde ara: enflasyon, 2001, saadet zinciri…" autocomplete="off" aria-label="Arşivde ara"></div><div class="sonuc" id="ara-sonuc"></div>'+
    '<div class="kisayol"><a class="file" href="#soru"><b>Günlük beş soru</b><span id="soru-ozet">Okuduğun bölümlerden tekrar.</span><span class="st" id="soru-st"></span></a>'+
    '<a class="file" href="#sozluk"><b>Sözlük</b><span>Bölümlerde açıklanan '+G.length+' kelime, tek yerde.</span><span class="st">Başvuru</span></a></div>';
  if(resume&&resume.parentNode) resume.parentNode.insertBefore(arac,resume.nextSibling); else if(ev) ev.insertBefore(arac,ev.firstChild);

  var dizin=null, bekleyen=null;
  function dizinKur(){
    dizin=[];
    document.querySelectorAll('.chapter').forEach(function(ch){
      var id=ch.id.replace(/^c-/,''), baslik='';
      ch.querySelectorAll('.prose h2, .prose h3, .prose p, .prose li').forEach(function(n){
        if(n.closest('.fine,.nav,.words,details,.hint,.time')) return;
        if(n.tagName==='H2'){baslik=n.textContent.trim()}
        var t=n.textContent.replace(/\s+/g,' ').trim(); if(t.length<12) return;
        dizin.push({id:id,baslik:baslik,metin:t,alt:kucuk(t),n:n});
      });
    });
  }
  function ara(q){
    var kutu=document.getElementById('ara-sonuc'); q=kucuk(q.trim());
    if(q.length<3){kutu.innerHTML='';return}
    if(!dizin) dizinKur();
    var sonuc=[], say=0;
    for(var i=0;i<dizin.length;i++){var p=dizin[i].alt.indexOf(q); if(p>=0){say++; if(sonuc.length<30) sonuc.push([dizin[i],p,i])}}
    if(!sonuc.length){kutu.innerHTML='<div class="yok">Bulunamadı.</div>';return}
    kutu.innerHTML=sonuc.map(function(r){
      var d=r[0],p=r[1], a=Math.max(0,p-70), b=Math.min(d.metin.length,p+q.length+110);
      var once=(a>0?'…':'')+esc(d.metin.slice(a,p)), orta=esc(d.metin.slice(p,p+q.length)), son=esc(d.metin.slice(p+q.length,b))+(b<d.metin.length?'…':'');
      return '<a href="#'+d.id+'" data-i="'+r[2]+'"><span class="k">'+esc(bolumAdi(d.id))+(d.baslik?' · '+esc(d.baslik):'')+'</span><p>'+once+'<mark>'+orta+'</mark>'+son+'</p></a>';
    }).join('')+(say>sonuc.length?'<div class="yok">'+(say-sonuc.length)+' sonuç daha var; aramayı daralt.</div>':'');
  }
  var araKutu=document.getElementById('ara'), araZ;
  araKutu.addEventListener('input',function(){clearTimeout(araZ);araZ=setTimeout(function(){ara(araKutu.value)},140)});
  document.getElementById('ara-sonuc').addEventListener('click',function(e){
    var a=e.target.closest('a[data-i]'); if(!a) return;
    bekleyen=dizin[+a.getAttribute('data-i')].n;
    if(location.hash===a.getAttribute('href')){e.preventDefault();git()}
  });
  function git(){
    if(!bekleyen) return false; var n=bekleyen; bekleyen=null;
    setTimeout(function(){n.scrollIntoView({block:'center'});n.classList.remove('bulundu');void n.offsetWidth;n.classList.add('bulundu')},80);
    return true;
  }

  /* ---------- kaldığın yer ---------- */
  var tost=document.getElementById('tost'), tostZ;
  function tostGoster(m,b,fn){document.getElementById('tost-m').textContent=m;var d=document.getElementById('tost-b');d.textContent=b;d.onclick=function(){tost.hidden=true;fn()};tost.hidden=false;clearTimeout(tostZ);tostZ=setTimeout(function(){tost.hidden=true},6000)}
  function bolum(){var h=(location.hash||'').slice(1);return /^[a-z]+-\d+$/.test(h)&&document.getElementById('c-'+h)?h:null}
  function boy(){return Math.max(1,document.documentElement.scrollHeight-window.innerHeight)}
  var kayZ;
  window.addEventListener('scroll',function(){
    clearTimeout(kayZ);kayZ=setTimeout(function(){
      var h=bolum(); if(!h) return; var y=oku('dni-yer',{})||{}, o=window.scrollY/boy();
      if(window.scrollY<300) delete y[h]; else y[h]=Math.round(o*1000)/1000;
      yaz('dni-yer',y);
    },400);
  },{passive:true});
  function yereDon(){
    var h=bolum(); if(!h) return; var o=(oku('dni-yer',{})||{})[h];
    if(!o||o<0.03||o>0.97) return;
    setTimeout(function(){window.scrollTo(0,Math.round(o*boy()));tostGoster('Kaldığın yerden devam.','Başa dön',function(){window.scrollTo(0,0)})},90);
  }

  /* ---------- sözlük ---------- */
  function sozlukCiz(q){
    q=kucuk(q||'').trim();
    var l=G.map(function(g){return [g[0],g[2]]}).sort(function(a,b){return a[0].localeCompare(b[0],'tr')});
    if(q) l=l.filter(function(x){return kucuk(x[0]).indexOf(q)>=0||kucuk(x[1]).indexOf(q)>=0});
    document.getElementById('sz-liste').innerHTML=l.length?l.map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join(''):'<div><dd>Bulunamadı.</dd></div>';
  }
  document.getElementById('sz-ara').addEventListener('input',function(e){sozlukCiz(e.target.value)});

  /* ---------- günlük beş soru: aralıklı tekrar ---------- */
  var ARALIK=[1,3,7,21,60], GUNLUK=5;
  function sorular(){
    var okunan=oku('dni-done',{})||{}, l=[];
    document.querySelectorAll('.chapter').forEach(function(ch){
      var id=ch.id.replace(/^c-/,''); if(!okunan[id]) return;
      ch.querySelectorAll('details').forEach(function(d,i){
        var s=d.querySelector('summary'); if(!s) return;
        var c=[].filter.call(d.children,function(x){return x!==s}).map(function(x){return '<p>'+esc(x.textContent)+'</p>'}).join('');
        l.push({id:id+'#'+i,bolum:id,q:s.textContent.trim(),a:c});
      });
    });
    return l;
  }
  function bekleyenler(){
    var d=oku('dni-soru',{})||{}, t=bugun(), tum=sorular();
    var eski=tum.filter(function(s){return d[s.id]&&d[s.id].t<=t}).sort(function(a,b){return d[a.id].t<d[b.id].t?-1:1});
    var yeni=tum.filter(function(s){return !d[s.id]});
    return {tum:tum,sira:eski.concat(yeni)};
  }
  function gunDurum(){var g=oku('dni-soru-gun',null);if(!g||g.gun!==bugun())g={gun:bugun(),n:0};return g}
  function soruOzet(){
    var b=bekleyenler(), g=gunDurum(), kalan=Math.max(0,Math.min(GUNLUK-g.n,b.sira.length));
    var st=document.getElementById('soru-st'), oz=document.getElementById('soru-ozet'); if(!st) return;
    if(!b.tum.length){oz.textContent='Önce bir bölümü okuyup "okudum" işaretle.';st.textContent='Henüz soru yok'}
    else if(kalan===0){oz.textContent='Okuduğun bölümlerden tekrar.';st.textContent='Bugün tamam'}
    else{oz.textContent='Okuduğun bölümlerden tekrar.';st.textContent=kalan+' soru bekliyor'}
  }
  function soruCiz(){
    var k=document.getElementById('soru-kart'), b=bekleyenler(), g=gunDurum();
    if(!b.tum.length){k.innerHTML='<p class="bitti">Henüz soru yok.</p><p>Bir bölümü bitirip sonundaki "Bu bölümü okudum" düğmesine bastığında, o bölümün soruları buraya gelir.</p>';return}
    if(g.n>=GUNLUK||!b.sira.length){
      var d=oku('dni-soru',{})||{}, yarin=bugun(1), yn=b.tum.filter(function(s){return !d[s.id]||d[s.id].t<=yarin}).length;
      k.innerHTML='<p class="bitti">Bugünlük tamam.</p><p>'+(g.n?'Bugün '+g.n+' soru yanıtladın. ':'')+(yn?'Yarın '+Math.min(GUNLUK,yn)+' soru bekliyor.':'Bekleyen soru yok; yeni bölüm okudukça gelir.')+'</p>';return}
    var s=b.sira[0];
    k.innerHTML='<div class="ust"><span>'+esc(bolumAdi(s.bolum))+'</span><b>'+(g.n+1)+' / '+GUNLUK+'</b></div><p class="q">'+esc(s.q)+'</p><div class="a" id="soru-a" hidden>'+s.a+'</div>'+
      '<div class="dg" id="soru-d1"><button class="btn" type="button" id="soru-goster">Cevabı göster</button></div>'+
      '<div class="dg" id="soru-d2" hidden><button class="btn ok" type="button" data-s="1">Bildim</button><button class="btn ghost" type="button" data-s="0">Bilemedim</button><a class="btn ghost" href="#'+s.bolum+'">Bölüme git</a></div>';
    document.getElementById('soru-goster').onclick=function(){document.getElementById('soru-a').hidden=false;document.getElementById('soru-d1').hidden=true;document.getElementById('soru-d2').hidden=false};
    k.querySelectorAll('button[data-s]').forEach(function(btn){btn.onclick=function(){
      var d=oku('dni-soru',{})||{}, e=d[s.id]||{k:-1}, bildi=btn.getAttribute('data-s')==='1';
      e.k=bildi?Math.min(e.k+1,ARALIK.length-1):0; e.t=bugun(bildi?ARALIK[e.k]:1); d[s.id]=e; yaz('dni-soru',d);
      var gg=gunDurum(); gg.n++; yaz('dni-soru-gun',gg); soruCiz(); soruOzet();
    }});
  }

  function yon(){
    var h=(location.hash||'#ev').slice(1);
    if(h==='sozluk') sozlukCiz(document.getElementById('sz-ara').value);
    if(h==='soru') soruCiz();
    if(h==='ev'||h==='') soruOzet();
    if(!git()) yereDon();
  }
  window.addEventListener('hashchange',yon);
  window.addEventListener('esitleme-geldi',function(){soruOzet();if((location.hash||'').slice(1)==='soru')soruCiz()});
  document.addEventListener('click',function(e){if(e.target.closest('button[data-done]')) setTimeout(soruOzet,50)});


  /* ---------- quiz ----------
     <section class="quiz" data-quiz="turkce-1"><h3>…</h3><ol class="qs"><li data-c="B" [data-k="turkce-1"]><p class="q">…</p><ul class="sec"><li>…</li>×5</ul><div class="coz">…</div></li></ol></section>
     Cevaplar dni-quiz içinde saklanır: { "turkce-1": { c:["B","A",…], t:"2026-10-08" } } */
  var HARF=['A','B','C','D','E'];
  function quizKur(sec){
    var id=sec.getAttribute('data-quiz'), sorular=[].slice.call(sec.querySelectorAll('ol.qs>li'));
    var bas=document.createElement('div'); bas.className='qb'; var h=sec.querySelector('h3'); sec.insertBefore(bas,h); bas.appendChild(h);
    var puan=document.createElement('span'); puan.className='puan'; bas.appendChild(puan);
    var alt=document.createElement('div'); alt.className='qalt'; alt.innerHTML='<span></span><button type="button">Baştan çöz</button>'; sec.appendChild(alt);
    sorular.forEach(function(li,si){
      var k=li.getAttribute('data-k'); if(k&&k!==id){ var e2=document.createElement('span'); e2.className='eski'; e2.textContent='tekrar · '+(k.split('-')[1])+'. parça'; li.querySelector('.q').appendChild(e2); }
      var coz=li.querySelector('.coz'); coz.hidden=true;
      [].forEach.call(li.querySelectorAll('ul.sec>li'),function(o,oi){
        var b=document.createElement('button'); b.type='button'; b.innerHTML='<b>'+HARF[oi]+')</b><span>'+o.innerHTML+'</span>'; b.setAttribute('data-h',HARF[oi]); o.innerHTML=''; o.appendChild(b);
        b.addEventListener('click',function(){ var d=oku('dni-quiz',{})||{}, r=d[id]||{c:[]}; r.c[si]=HARF[oi]; for(var j=0;j<sorular.length;j++) if(r.c[j]===undefined) r.c[j]=null; r.t=new Date().toISOString().slice(0,10); d[id]=r; yaz('dni-quiz',d); ciz(); });
      });
    });
    function ciz(){
      var r=((oku('dni-quiz',{})||{})[id]||{c:[]}).c||[], dogru=0, cevap=0;
      sorular.forEach(function(li,si){
        var c=li.getAttribute('data-c'), sec2=r[si]||null, coz=li.querySelector('.coz'), et=coz.querySelector('b.s');
        [].forEach.call(li.querySelectorAll('ul.sec button'),function(b){ var h2=b.getAttribute('data-h'); b.disabled=!!sec2; b.className = !sec2 ? '' : (h2===c ? 'dogru' : (h2===sec2 ? 'yanlis' : '')); });
        coz.hidden=!sec2;
        if(sec2){ cevap++; if(sec2===c) dogru++; if(!et){ et=document.createElement('b'); et.className='s'; coz.insertBefore(et,coz.firstChild); } et.className='s'+(sec2===c?'':' y'); et.textContent = sec2===c ? 'Doğru · '+c : 'Yanlış · doğru cevap '+c; }
      });
      puan.textContent = cevap ? dogru+' / '+sorular.length+(cevap<sorular.length?' · '+(sorular.length-cevap)+' soru kaldı':'') : sorular.length+' soru';
      alt.firstChild.textContent = cevap<sorular.length ? 'Önce kendin çöz, sonra seç; seçince çözüm açılır.' : (dogru===sorular.length ? 'Hepsi doğru. Sonraki parçaya geçebilirsin.' : (sorular.length-dogru)+' yanlış. Yanlış yaptığın soruların çözümünü oku, ilgili başlığa dön, yarın baştan çöz.');
      alt.lastChild.hidden=!cevap;
    }
    alt.lastChild.addEventListener('click',function(){ var d=oku('dni-quiz',{})||{}; delete d[id]; yaz('dni-quiz',d); ciz(); sec.scrollIntoView({block:'start'}); });
    window.addEventListener('esitleme-geldi',ciz); ciz();
  }
  document.querySelectorAll('section.quiz[data-quiz]').forEach(quizKur);

  /* ---------- kaynak güveni rozeti ---------- */
  var GUVEN=/*GUVEN*/{}, GAD={d:'ana rakamlar doğrulandı',k:'kısmen doğrulandı',h:'çoğu hafızadan'};
  document.querySelectorAll('.chapter').forEach(function(ch){
    var id=ch.id.replace(/^c-/,''), g=GUVEN[id], t=ch.querySelector('.time'); if(!g||!t) return;
    var a=document.createElement('a'); a.className='gv g-'+g; a.textContent=GAD[g]; a.setAttribute('role','button'); a.tabIndex=0;
    a.title='Bu bölümde neyin kaynakla karşılaştırıldığını, neyin hafızadan yazıldığını gör';
    a.addEventListener('click',function(){ var h=[].filter.call(ch.querySelectorAll('h4'),function(x){return /Kaynak ve doğrulama/.test(x.textContent)})[0]; if(h) h.scrollIntoView({block:'start'}); });
    t.appendChild(a);
  });

  /* ---------- vurgulama ve not ----------
     Vurgu, paragrafın kaçıncı harfinden kaçıncı harfine kadar olduğu ile saklanır (dni-isaret);
     metin değişirse baştaki parça aranır, bulunamazsa o vurgu sessizce atlanır. */
  var BLOK='p,li,td,dd,blockquote';
  function bloklar(ch){ return [].filter.call(ch.querySelectorAll(BLOK),function(b){ return !b.querySelector(BLOK) && !b.closest('.notum,.words,details,.quiz'); }); }
  function isaretler(){ return oku('dni-isaret',{})||{}; }
  function boya(b,a,z,vid){
    var w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT,null), n, p=0, hedef=[];
    while((n=w.nextNode())){ var u=n.nodeValue.length; if(p+u>a && p<z) hedef.push([n,Math.max(0,a-p),Math.min(u,z-p)]); p+=u; }
    hedef.forEach(function(h){ var n=h[0]; if(n.parentNode.closest && n.parentNode.closest('mark.vurgu')) return;
      if(h[2]<n.nodeValue.length) n.splitText(h[2]); if(h[1]>0) n=n.splitText(h[1]);
      var m=document.createElement('mark'); m.className='vurgu'; m.setAttribute('data-v',vid); n.parentNode.insertBefore(m,n); m.appendChild(n); });
  }
  function temizle(ch){ ch.querySelectorAll('mark.vurgu').forEach(function(m){ var p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize(); }); }
  function vurgulaCiz(ch){
    var id=ch.id.replace(/^c-/,''), l=isaretler()[id]||[], B=bloklar(ch); temizle(ch);
    l.forEach(function(v){
      var b=B[v.i], a=v.a, z=v.b;
      if(!b || b.textContent.slice(a,z).slice(0,24)!==v.t.slice(0,24)){            // metin kaymış: parçayı ara
        b=null; for(var j=0;j<B.length;j++){ var k=B[j].textContent.indexOf(v.t); if(k>=0){ b=B[j]; a=k; z=k+v.t.length; break; } }
      }
      if(b) boya(b,a,z,v.id);
    });
    notCiz(ch);
  }
  function notCiz(ch){
    var id=ch.id.replace(/^c-/,''), kutu=ch.querySelector('.notum');
    if(!kutu){
      kutu=document.createElement('div'); kutu.className='notum';
      kutu.innerHTML='<h4>Vurgularım ve notum</h4><ul></ul><textarea placeholder="Bu bölümden aklında kalan, katılmadığın, sonra bakacağın…" aria-label="Bölüm notu"></textarea><p class="ip">Metinde bir yeri seçip Vurgula’ya basarsan burada listelenir. Not ve vurgular cihazların arasında eşitlenir.</p>';
      var d=ch.querySelector('button[data-done]'), yer=d?(d.closest('.nav')||d):null;
      if(yer) yer.parentNode.insertBefore(kutu,yer); else (ch.querySelector('.prose')||ch).appendChild(kutu);
      var ta=kutu.querySelector('textarea'), z;
      ta.addEventListener('input',function(){ clearTimeout(z); z=setTimeout(function(){ var n=oku('dni-not',{})||{}, v=ta.value.trim().slice(0,4000); if(v) n[id]=v; else delete n[id]; yaz('dni-not',n); },600); });
      kutu.querySelector('ul').addEventListener('click',function(e){ var li=e.target.closest('li'); if(!li) return; var m=ch.querySelector('mark.vurgu[data-v="'+li.getAttribute('data-v')+'"]'); if(m){ m.scrollIntoView({block:'center'}); m.classList.remove('bulundu'); void m.offsetWidth; m.classList.add('bulundu'); } });
    }
    var ta2=kutu.querySelector('textarea'); if(document.activeElement!==ta2) ta2.value=(oku('dni-not',{})||{})[id]||'';
    var ul=kutu.querySelector('ul'), l=(isaretler()[id]||[]).slice().sort(function(x,y){return x.i-y.i||x.a-y.a}); ul.innerHTML='';
    l.forEach(function(v){ var li=document.createElement('li'); li.setAttribute('data-v',v.id); li.textContent=v.t.length>180?v.t.slice(0,180)+'…':v.t; ul.appendChild(li); });
  }
  document.querySelectorAll('.chapter').forEach(vurgulaCiz);
  window.addEventListener('esitleme-geldi',function(){ document.querySelectorAll('.chapter').forEach(vurgulaCiz); });

  var vd=document.getElementById('vdugme'), secim=null;
  function secimOku(){
    var s=window.getSelection(); if(!s||s.isCollapsed||!s.rangeCount) return null;
    var r=s.getRangeAt(0), kok=r.commonAncestorContainer; if(kok.nodeType!==1) kok=kok.parentNode;
    var ch=kok.closest('.chapter'); if(!ch || kok.closest('.notum')) return null;
    if(String(s).replace(/\s+/g,'').length<3) return null;
    var B=bloklar(ch), l=[];
    function ofs(b,dugum,o){ var x=document.createRange(); x.selectNodeContents(b); try{ x.setEnd(dugum,o); }catch(e){ return 0; } return String(x).length; }
    B.forEach(function(b,i){
      if(!r.intersectsNode(b)) return;
      var a=b.contains(r.startContainer)?ofs(b,r.startContainer,r.startOffset):0, z=b.contains(r.endContainer)?ofs(b,r.endContainer,r.endOffset):b.textContent.length;
      var t=b.textContent.slice(a,z); if(t.trim().length<2) return;
      l.push({i:i,a:a,b:z,t:t});
    });
    return l.length?{ch:ch,l:l.slice(0,12)}:null;
  }
  document.addEventListener('selectionchange',function(){ secim=secimOku(); vd.textContent='Vurgula'; vd.onclick=vurgula; vd.hidden=!secim; });
  vd.addEventListener('mousedown',function(e){ e.preventDefault(); });     // seçim kaybolmasın
  function vurgula(){
    if(!secim) return; var id=secim.ch.id.replace(/^c-/,''), d=isaretler(); d[id]=d[id]||[];
    secim.l.forEach(function(v,k){ v.id='v'+Date.now().toString(36)+k; d[id].push(v); });
    yaz('dni-isaret',d); var ch=secim.ch; try{ window.getSelection().removeAllRanges(); }catch(e){}
    vd.hidden=true; vurgulaCiz(ch);
  }
  document.addEventListener('click',function(e){
    var m=e.target.closest('mark.vurgu'); if(!m || (window.getSelection()&&!window.getSelection().isCollapsed)) return;
    var ch=m.closest('.chapter'), id=ch.id.replace(/^c-/,''), vid=m.getAttribute('data-v');
    vd.textContent='Vurguyu kaldır'; vd.hidden=false;
    vd.onclick=function(){ var d=isaretler(); d[id]=(d[id]||[]).filter(function(v){return v.id!==vid}); if(!d[id].length) delete d[id]; yaz('dni-isaret',d); vd.hidden=true; vurgulaCiz(ch); };
    setTimeout(function(){ if(vd.textContent==='Vurguyu kaldır') vd.hidden=true; },5000);
  });

  /* bu betik, görünümler sayfaya eklendikten sonra çalışır: açılıştaki adresi yeniden yönlendir */
  try{ window.dispatchEvent(new HashChangeEvent('hashchange')); }catch(e){ yon(); }
})();
</script>
