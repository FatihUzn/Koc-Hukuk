<title>Dünya Nasıl İşler Arşivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Kütüphane düzeni: solda dosyanın bölümleri, ortada tek bölüm (anlatı), geniş ekranda sağ kenarda notlar. Tablo yok; kartlar ekrana sığar. Tema: lacivert-mor; lavanta = yapı, nane = "neden", kehribar = uyarı. */
:root{
  --bg:#0f1020; --bg2:#15172b; --paper:#191b31; --fg:#e3e1ee; --strong:#ffffff; --muted:#9a9cb8; --line:#2a2d48;
  --lav:#b9a7f5; --lav-soft:#262349; --mint:#6fe3d0; --mint-soft:#14292b; --amber:#f2b96b; --amber-soft:#30271a;
  --body:"Inter","Segoe UI",Roboto,Arial,sans-serif; --display:"Fraunces",Georgia,serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.8;background:var(--bg);
  background-image:radial-gradient(1100px 650px at 90% -10%,#34276a 0%,rgba(52,39,106,0) 60%),radial-gradient(800px 560px at -10% 105%,#123741 0%,rgba(18,55,65,0) 60%);background-attachment:fixed}
a{color:var(--lav);text-underline-offset:3px;text-decoration-color:rgba(185,167,245,.4)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.shell{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 90px}
.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.brand b{color:var(--mint);font-weight:500}
.crumb{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.06em}

/* görünümler: JS yoksa hepsi alt alta görünür */
.js .view{display:none}
.js .view.on{display:block}

/* ---------- ANA SAYFA ---------- */
h1{font-weight:300;font-size:clamp(34px,6vw,54px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 14px;color:var(--strong);text-wrap:balance}
h1 em{font-family:var(--display);font-style:italic;font-weight:400;color:var(--lav)}
.lede{font-size:20px;line-height:1.65;color:var(--muted);max-width:62ch;margin:0 0 10px;font-weight:300}
.resume{display:none;background:var(--mint-soft);border-radius:12px;padding:14px 18px;margin:22px 0 6px;max-width:62ch}
.resume.on{display:block}
.shelf{margin-top:44px}
.shelf h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:26px;color:var(--lav);margin:0 0 4px}
.shelf .sub{font-size:15.5px;color:var(--muted);margin:0 0 14px;max-width:70ch;line-height:1.6}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.file{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;line-height:1.5}
.file b{display:block;font-size:17px;font-weight:600;color:var(--strong)}
.file span{display:block;font-size:14.5px;color:var(--muted);margin-top:4px}
.file .st{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:10px;color:var(--muted)}
a.file{text-decoration:none;color:inherit;border-color:var(--lav)}
a.file .st{color:var(--mint)}
a.file:hover{background:var(--lav-soft)}
.file.ref .st{color:var(--amber)}

/* ---------- DOSYA / BÖLÜM ---------- */
.book{display:grid;grid-template-columns:250px minmax(0,1fr);gap:44px}
@media (max-width:920px){.book{grid-template-columns:minmax(0,1fr);gap:18px}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);align-self:start;max-height:calc(100vh - 30px);overflow:auto}
@media (max-width:920px){.side{position:static;max-height:none;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}}
.side .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.side .name{font-size:17px;font-weight:600;color:var(--strong);line-height:1.3;margin-bottom:10px}
.side ol{list-style:none;margin:0;padding:0;counter-reset:c}
.side li{counter-increment:c;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.side li a,.side li span{display:block;padding:9px 0 9px 30px;position:relative;text-decoration:none;color:var(--fg)}
.side li span{color:var(--muted)}
.side li a::before,.side li span::before{content:counter(c);position:absolute;left:0;top:9px;font-family:var(--mono);font-size:12px;color:var(--mint)}
.side li span::before{color:var(--muted)}
.side li a.cur{color:var(--lav);font-weight:600}
.side li a.done::after{content:"okundu";font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);margin-left:8px}
.side .later{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.side .home{display:inline-block;margin-top:14px;font-size:14px}

.chap{min-width:0}
.prose{max-width:660px}
@media (min-width:1280px){.prose{margin-right:300px}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint)}
.chap h1{font-size:clamp(30px,5vw,44px);font-weight:300;margin:8px 0 12px}
.time{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 22px}
.ask{background:var(--paper);border-radius:14px;padding:18px 22px;margin:0 0 34px}
.ask .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lav);margin-bottom:6px}
.ask p{margin:0;font-size:19px;line-height:1.6;color:var(--strong)}
h2.s{font-family:var(--display);font-style:italic;font-weight:400;font-size:27px;line-height:1.25;color:var(--lav);margin:58px 0 16px;text-wrap:balance}
h3{font-size:19px;font-weight:600;color:var(--strong);margin:34px 0 8px}
p{margin:0 0 20px}
strong{font-weight:600;color:var(--strong)}
ul,ol{margin:0 0 20px;padding-left:24px}
li{margin-bottom:8px}

.why{background:var(--mint-soft);border-left:3px solid var(--mint);border-radius:0 12px 12px 0;padding:16px 20px;margin:28px 0}
.why .t,.warn .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.why .t{color:var(--mint)} .why p:last-child,.warn p:last-child{margin-bottom:0}
.warn{background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 12px 12px 0;padding:16px 20px;margin:28px 0}
.warn .t{color:var(--amber)}

/* kenar notu */
.mn{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:22px 0;font-size:15px;line-height:1.55;color:var(--fg)}
.mn b{display:block;font-size:11.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lav);font-weight:500;margin-bottom:4px}
@media (min-width:1280px){.mn{float:right;clear:right;width:260px;margin:4px -300px 16px 0}}

/* kartlar: tablo yerine */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px 0}
.cards > div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.55;min-width:0}
.cards b{display:block;font-size:16.5px;color:var(--strong);margin-bottom:4px}
.cards .k{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);margin-bottom:6px}
.led{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:20px 0;font-size:16px;line-height:1.55}
.led .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);margin-bottom:8px}
.led .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.led .row{grid-template-columns:1fr}}
.led .row div{min-width:0}
.led small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.led em{font-style:normal;color:var(--mint);font-family:var(--mono);font-size:14.5px}

.steps{list-style:none;padding:0;margin:24px 0;counter-reset:s}
.steps li{counter-increment:s;position:relative;background:var(--paper);border-radius:12px;padding:13px 16px 13px 54px;margin-bottom:10px;font-size:16.5px;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:14px;top:14px;width:27px;height:27px;border-radius:50%;border:1px solid var(--lav);color:var(--lav);font-family:var(--mono);font-size:12.5px;display:grid;place-items:center}

.end{border-top:1px solid var(--line);margin-top:60px;padding-top:26px}
.sum{background:var(--paper);border-radius:14px;padding:20px 24px;margin:14px 0 26px}
.sum ol{margin:0;padding-left:22px}
details{background:var(--paper);border-radius:12px;padding:14px 18px;margin:10px 0}
summary{cursor:pointer;font-weight:500;color:var(--strong);line-height:1.5}
details p{margin:12px 0 2px;font-size:17px}
.nav{display:flex;flex-wrap:wrap;gap:12px;margin:34px 0 10px}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:999px;padding:11px 22px;cursor:pointer;text-decoration:none;border:1px solid var(--lav);background:var(--lav);color:#17142e}
.btn.ghost{background:transparent;color:var(--lav)}
.btn.ok{border-color:var(--mint);background:transparent;color:var(--mint)}
.fine{font-size:15px;line-height:1.65;color:var(--muted)}
.fine li{margin-bottom:6px}
.fine h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:26px 0 8px}

/* ferahlık */
.prose p{margin:0 0 26px}
.prose{line-height:1.85}
.hint{font-size:15px;color:var(--muted);margin:-14px 0 30px}
/* kelime */
.term{border-bottom:1.5px dotted var(--lav);cursor:help}
.term:hover,.term:focus-visible{background:var(--lav-soft);outline:none;border-radius:3px}
.defbox{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.defbox .in{pointer-events:auto;max-width:640px;margin:0 auto;background:#221f45;border:1px solid var(--lav);border-radius:14px;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.5);font-size:16.5px;line-height:1.6}
.defbox b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);font-weight:500;margin-bottom:4px}
.defbox button{display:block;margin-top:10px;font:inherit;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 14px;cursor:pointer}
.words{margin:14px 0 26px;display:grid;gap:8px}
.words div{background:var(--paper);border-radius:10px;padding:10px 14px}
.words dt{font-weight:600;color:var(--strong);font-size:16px}
.words dd{margin:2px 0 0;font-size:15.5px;line-height:1.55;color:var(--fg)}
/* pano */
.pano{max-width:1100px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.tile .k{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lav)}
.tile .v{font-size:34px;font-weight:300;line-height:1.15;color:var(--strong);margin:8px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .d{display:block;font-family:var(--mono);font-size:12px;color:var(--mint);margin-bottom:14px}
.tile p{font-size:16px;line-height:1.65;margin:0 0 12px}
.tile p:last-child{margin-bottom:0}
</style>
